        <button class="hintbtn" data-act="hint">${portrait('senpai:smile', 32)}<span>片桐課長に相談する</span><em>残り${s.hintsLeft}回</em></button>${toastHTML()}</section>`;
    }
    if (st.type === 'event' || st.type === 'policy' || st.type === 'incident' || st.type === 'special'){
      const d = E.eventDef(s);
      const kind = d.kind === 'policy' ? ['plan', '作戦会議'] : d.kind === 'incident' ? ['inc', `${st.month}月末・出来事`] : d.kind === 'special' ? ['team', `${teamOf().name}の物語`] : ['ev', `${st.month}月・経営判断`];
      const extra = d.kind === 'policy' && s.fatigue ? `<p class="note">いまの疲労は${s.fatigue}（戦力−${s.fatigue * C.fatiguePower}）。${s.fatigue >= 3 ? '故障しやすくなっている。' : ''}</p>` : '';
      const body = optPick ? (o => `<div class="confirm"><div class="clabel">この方針で決めますか？</div><b class="cname">${esc(o.label)}</b>${prosCons(o)}</div>
          <div class="actions"><button class="btn primary" data-act="decide">決定</button><button class="btn" data-act="unpick">選び直す</button></div>`)(d.options.find(o => o.id === optPick))
        : `<div class="choices">${d.options.map(o => `<button class="choice" data-opt="${o.id}"><b>${esc(o.label)}</b>${prosCons(o)}</button>`).join('')}</div>`;
      return `<section class="win">${ribbon(kind[0], kind[1])}<h2>${esc(d.title)}</h2><p class="lead">${esc(d.text)}</p>${extra}
        ${d.kind === 'event' ? advisorsHTML(st.id) : ''}${body}${toastHTML()}</section>`;
    }
    if (st.type === 'play'){
      const pol = C.policies[s.choices['pol' + st.month] || 'normal'];
      return `<section class="win">${ribbon('play', `${st.month}月・公式戦`)}<h2>${st.month}月の${C.gamesPerPair * 5}試合</h2>
        <p class="lead">今月の方針：<b>${esc(pol.label)}</b></p>
        <button class="bigplay" data-act="play"><span>PLAY BALL</span><small>${st.month}月の試合を始める</small></button>${toastHTML()}</section>`;
    }
    if (st.type === 'injury'){
      return `<section class="win">${ribbon('inc', '8月・メディカルチェック')}<h2>精密検査の結果待ち</h2>
        <p class="lead">長期離脱なら戦力が落ちる${(s.grade || 1) === 1 ? '。契約金で計上した資産の価値も見直しが必要になる' : ''}。${s.fatigue ? `疲労がたまっている（${s.fatigue}）ぶん、危険は高い。` : ''}</p>
        <div class="actions"><button class="btn primary" data-act="injury">検査結果を聞く</button></div></section>`;
    }
    if (st.type === 'closing'){
      const list = E.closingEntries(s);
      return `<section class="win">${ribbon('q', `第${s.year}期・決算整理（12月31日付）`)}<h2>片桐課長が用意した整理仕訳</h2>
        <div class="choices">${list.map(e => `<div class="slip small"><div class="slip-head"><span>${esc(e.title)}</span></div>${entryHTML(e)}</div>`).join('')}</div>
        <div class="actions"><button class="btn primary" data-act="closing">まとめて記帳する</button></div>${toastHTML()}</section>`;
    }
    if (st.type === 'statements'){
      const f = E.statements(E.ledger(s, 'user'));
      return `<section class="win">${ribbon('q', `第${s.year}期の決算日（12月31日）`)}<h2>あなたの作った決算書</h2>
        <div class="bignum"><span>当期純利益</span><b class="num ${f.net >= E.target(s) ? 'ok' : 'ng'}">${fmt(f.net)}</b><small>目標 ${fmt(E.target(s))}</small></div>
        ${fsHTML(f)}<div class="actions"><button class="btn primary" data-act="audit">監査を受ける</button></div>${toastHTML()}</section>`;
    }
    if (st.type === 'audit') return auditHTML();
    return '';
  }

  function tableRows(items){ return items.filter(x => x.v !== 0).map(x => `<tr><td>${esc(x.name)}</td><td class="num">${fmt(x.v)}</td></tr>`).join(''); }
  function fsHTML(f){
    return `<div class="fs">
      <div><h3>損益計算書</h3><table class="ledger"><tr><th>収益</th><th class="num">金額</th></tr>${tableRows(f.rev)}
        <tr class="sub"><td>収益合計</td><td class="num">${fmt(f.revTotal)}</td></tr>
        <tr><th>費用</th><th></th></tr>${tableRows(f.exp)}<tr class="sub"><td>費用合計</td><td class="num">${fmt(f.expTotal)}</td></tr>
        <tr class="total"><td>当期純利益</td><td class="num">${fmt(f.net)}</td></tr></table></div>
      <div><h3>貸借対照表</h3><table class="ledger"><tr><th>資産</th><th class="num">金額</th></tr>${tableRows(f.assets)}
        <tr class="total"><td>資産合計</td><td class="num">${fmt(f.aTotal)}</td></tr>
        <tr><th>負債</th><th></th></tr>${tableRows(f.liab)}<tr><th>純資産</th><th></th></tr>${tableRows(f.equity)}
        <tr class="total"><td>負債・純資産合計</td><td class="num">${fmt(f.lTotal + f.eTotal)}</td></tr></table></div></div>`;
  }

  function paperHTML(r){
    const tot = s.standings[s.teamId]; const wp = r.w / (r.w + r.l);
    const k = wp >= 0.56 ? 'good' : wp >= 0.45 ? 'even' : 'bad';
    const comment = pickOne(ST.monthly[k], r.month + s.year);
    return `<section class="paper"><div class="mast"><b>${esc(ST.paperName)}</b><span>第${s.year}期 ${r.month}月末号</span></div>
      <div class="head">${esc(fillT(ST.headlines[k], {w:r.w, l:r.l, m:r.month}))}</div>
      <div class="sub">${r.month}月は${r.w}勝${r.l}敗。通算${tot.w}勝${tot.l}敗でリーグ${rankOf()}位。</div>
      <div class="pbody"><div class="pquote">${portrait(k === 'good' ? 'manager:smile' : k === 'bad' ? 'manager:worry' : 'manager:neutral', 56)}<p>試合後、渋川監督は「${esc(comment)}」と語った。</p></div>
        <div class="pbox"><b>球団の懐（経理部調べ）</b><div class="result">
          <span>入場料</span><span class="num">${fmt(r.ticket)}</span><span>グッズ</span><span class="num">${fmt(r.goods + r.special)}</span>
          ${r.specialCost ? `<span>うち記念品の原価</span><span class="num">${fmt(-r.specialCost)}</span>` : ''}
          ${r.tv ? `<span>放映権料</span><span class="num">${fmt(r.tv)}</span>` : ''}${r.beer ? `<span>ビール</span><span class="num">${fmt(r.beer)}</span>` : ''}
          <span>年俸</span><span class="num">${fmt(-r.salary)}</span><span>球場使用料</span><span class="num">${fmt(-r.stadium)}</span><span>運営費</span><span class="num">${fmt(-r.ops)}</span>
          <span class="total">月の収支</span><span class="num total">${fmt(r.net)}</span></div></div></div></section>
      <div class="actions"><button class="btn primary" data-act="next">次へ</button></div>`;
  }

  function auditHTML(){
    const a = E.audit(s); const g = a.grade.g;
    const sold = g === 'D' && s.year < s.years;
    const ending = (ST.yearEnd[g] || []).map(l => dialogBox(l, false)).join('');
    const findings = a.wrong.map(e => `<div class="finding"><b>${e.month}月｜${esc(e.title)}</b><span class="small">${esc(e.prompt)}</span>
      <span class="lbl">あなたの仕訳</span>${entryHTML(e.user)}<span class="lbl">正しい仕訳</span>${entryHTML(e.correct)}
      <span class="small">${esc(e.why)}</span><span class="small dim">${esc(e.explain)}</span></div>`).join('');
    const cmp = (label, r, c) => `<tr><td>${label}</td><td class="num">${fmt(r)}</td><td class="num">${fmt(c)}</td></tr>`;
    const sign = d => ['L', 'E', 'R'].includes(d.type) ? -1 : 1;
    const nextBtn = sold ? `<button class="btn primary" data-act="sold">エンディングへ</button>`
      : s.year < s.years ? `<button class="btn primary" data-act="nextYear">第${s.year + 1}期へ進む</button>`
      : `<button class="btn primary" data-act="final">全${s.years}期の最終評価へ</button>`;
    return `${ending}<section class="win">${ribbon('q', `第${s.year}期・監査報告`)}
      <div class="gradebox"><span>今季の評価</span><b class="grade g${g}">${g}</b><small>${a.total}点／100点</small></div>
      <div class="scoregrid"><div><span>順位 ${a.rank}位</span><b>${a.rankPts}</b></div>
        <div><span>利益（監査後）</span><b>${a.profitPts}</b></div><div><span>監査 ${a.questions - a.wrong.length}/${a.questions}問正解</span><b>${a.auditPts}</b></div></div>
      <p class="small dim">配点は 順位${C.score.rankPts[0]}・利益${C.score.profitMax}・監査${C.score.auditMax}。${C.score.auditMode === 'rate' ? `監査点は ${C.score.auditMax}×正答率。` : ''}合計${C.score.grades.find(x => x.g === 'C').min}点未満（評価D）だと球団売却。</p>
      <p class="small dim">利益点は、監査後の当期純利益 ${fmt(a.profit)} を今季の目標 ${fmt(a.target)} と比べて計算。${s.year < s.years && !sold ? '翌期は、監査で修正したあとの残高から始まる。' : ''}</p>
      <h3>監査で見つかった誤り（${a.wrong.length}件／判断した仕訳${a.questions}件）</h3>
      ${a.wrong.length ? findings : '<p class="good">誤りはなし。帳簿はそのまま信頼できる。</p>'}
      <h3>修正前と修正後</h3>
      <div class="scroll"><table class="ledger"><tr><th>項目</th><th class="num">あなた</th><th class="num">監査後</th></tr>
        ${cmp('収益合計', a.reported.revTotal, a.corrected.revTotal)}${cmp('費用合計', a.reported.expTotal, a.corrected.expTotal)}
        ${cmp('当期純利益', a.reported.net, a.corrected.net)}${cmp('資産合計', a.reported.aTotal, a.corrected.aTotal)}
        ${cmp('負債合計', a.reported.lTotal, a.corrected.lTotal)}
        ${a.diffs.map(d => cmp('└ ' + d.name, sign(d) * d.user, sign(d) * d.correct)).join('')}
      </table></div>
      <div class="actions">${nextBtn}</div></section>`;
  }

  function finalHTML(){
    const f = E.finish(s);
    const tm = (ST.teams || {})[s.teamId] || {};
    const good = !f.sold && ['S', 'A', 'B'].includes(f.grade);
    const lines = ((tm.finale && tm.finale[good ? 'good' : 'bad']) || []).concat(s.final === 'sold' ? ST.soldEnding : (ST.finalEnding[f.grade] || []));
    const g = f.sold ? 'D' : f.grade;
    return `${hudHTML()}<div class="viewwrap">${sceneSVG()}</div>${lines.map(l => dialogBox(l, false)).join('')}
      <section class="win">${ribbon('q', f.sold ? `第${f.years}期で球団売却` : `全${s.years}期終了・最終評価`)}
        <div class="gradebox">${logoOf(teamOf(), 56)}<span>${esc(teamOf().name)}の${f.years}年間</span><b class="grade g${g}">${g}</b><small>平均 ${f.avg}点・優勝${f.titles}回</small></div>
        <div class="scroll"><table class="ledger"><tr><th>シーズン</th><th class="num">成績</th><th class="num">順位</th><th class="num">利益</th><th class="num">誤り</th><th class="num">評価</th></tr>
          ${s.history.map(h => `<tr><td>第${h.year}期</td><td class="num">${h.w}-${h.l}</td><td class="num">${h.rank}位</td><td class="num">${fmt(h.profit)}</td><td class="num">${h.wrong}/${h.questions}</td><td class="num">${h.grade}</td></tr>`).join('')}</table></div>
        <div class="actions"><button class="btn primary" data-act="restart">球団を選び直す</button><button class="btn" data-act="again">同じ球団で最初から</button><button class="btn" data-act="totitle">タイトルへ</button></div>
        <button class="btn review" data-sheet="review">復習ノートを開く（全${f.years}期の問題）</button></section>`;
  }

  /* ---------- 帳簿メニュー（下のドックから開く） ---------- */
  // 復習ノートに載せる問題：監査が済んだ期の分だけ（今季の分は監査まで伏せる）
  const reviewable = () => (s.review || []).filter(r => r.year < s.year || s.final || (E.step(s) || {}).type === 'audit');
  let reviewFilter = 'miss';
  function reviewHTML(){
    const all = reviewable(), miss = all.filter(r => !r.ok);
    const list = (reviewFilter === 'miss' ? miss : all).slice().sort((a, b) => b.year - a.year || a.month - b.month);
    const tabs = `<div class="rtabs"><button class="rtab${reviewFilter === 'miss' ? ' on' : ''}" data-rf="miss">間違えた問題（${miss.length}）</button><button class="rtab${reviewFilter === 'all' ? ' on' : ''}" data-rf="all">すべて（${all.length}）</button></div>`;
    const pending = (s.review || []).length - all.length;
    const note = pending > 0 ? `<p class="small dim">今季の${pending}問は、監査のあとに載ります。</p>` : '';
    if (!list.length) return tabs + note + `<p class="dim">${all.length ? '間違えた問題はありません。お見事。' : 'まだ載せられる問題がありません。12月の監査が終わると、その期の問題がここに並びます。'}</p>`;
    let lastYear = null;
    const items = list.map(r => {
      const head = r.year !== lastYear ? `<h3 class="ryear">第${r.year}期</h3>` : ''; lastYear = r.year;
      const others = r.options.filter((o, i) => !o.correct && i !== r.picked);
      return `${head}<article class="rcard ${r.ok ? 'ok' : 'ng'}">
        <div class="rhead"><span class="rmark">${r.ok ? '○' : '×'}</span><b>${r.month}月｜${esc(r.title)}</b></div>
        <p class="rq">${esc(r.prompt)}</p>
        ${r.ok ? '' : `<span class="lbl">あなたの仕訳</span>${entryHTML(r.user)}<p class="rwhy">${esc(r.why || '')}</p>`}
        <span class="lbl ok">正しい仕訳</span>${entryHTML(r.correct)}
        <p class="rexp"><b>解説</b>${esc(r.explain)}</p>
        ${others.length ? `<details class="rmore"><summary>${r.ok ? 'ほかの案' : '残りの案'}はなぜ違う？</summary>${others.map(o => `${entryHTML(o.entry)}<p class="rwhy">${esc(o.why || '')}</p>`).join('')}</details>` : ''}
      </article>`;
    }).join('');
    return tabs + note + items;
  }
  function dockHTML(){
    const B = (id, label, sub) => `<button class="dockbtn${sheet === id ? ' on' : ''}" data-sheet="${id}"><b>${label}</b><small>${sub}</small></button>`;
    const rv = reviewable(), miss = rv.filter(r => !r.ok).length;
    return `<nav class="dock">${B('review', '復習', rv.length ? `誤り${miss}件` : '監査のあと')}${B('journal', '仕訳帳', `${s.journal.length}件`)}${B('tb', '試算表', '残高')}${B('fs', '決算書', 'いまの数字')}${B('st', '順位表', `${rankOf()}位`)}</nav>`;
  }
  function sheetHTML(){
    if (!sheet) return '';
    let title = '', body = '';
    if (sheet === 'review'){
      title = '復習ノート（監査済みの問題）';
      body = reviewHTML();
    } else if (sheet === 'journal'){
      title = `仕訳帳（第${s.year}期）`;
      const rows = s.journal.slice().reverse();
      body = rows.length ? rows.map(e => `<div class="jrow"><span class="m">${e.month}月</span><div><div class="t">${esc(e.title)} ${e.kind === 'q' ? '<span class="pill q">判断</span>' : '<span class="pill">自動</span>'}</div>${entryHTML(e.user)}</div></div>`).join('')
        : `<p class="dim">今季はまだ記帳がない。</p>`;
    } else if (sheet === 'tb'){
      title = '残高試算表（あなたの帳簿）';
      const bal = E.ledger(s, 'user'); let dr = 0, cr = 0;
      const rows = C.accounts.filter(a => bal[a.id] !== 0).map(a => { const v = bal[a.id]; if (v > 0) dr += v; else cr -= v;
        return `<tr><td>${esc(a.name)}</td><td class="num">${v > 0 ? fmt(v) : ''}</td><td class="num">${v < 0 ? fmt(-v) : ''}</td></tr>`; }).join('');
      body = `<table class="ledger"><tr><th>勘定科目</th><th class="num">借方</th><th class="num">貸方</th></tr>${rows}
        <tr class="total"><td>合計</td><td class="num">${fmt(dr)}</td><td class="num">${fmt(cr)}</td></tr></table>
        <p class="small dim">貸借が一致していても、科目や金額が正しいとは限らない。</p>`;
    } else if (sheet === 'fs'){
      title = 'いまの決算書（あなたの帳簿）';
      body = fsHTML(E.statements(E.ledger(s, 'user'))) + '<p class="small dim">決算整理の前は、期末の数字とは違う。</p>';
    } else {
      title = '順位表';
      body = C.leagues.map(lg => `<h3>${lg.name}</h3><table class="ledger"><tr><th>球団</th><th class="num">勝</th><th class="num">敗</th><th class="num">勝率</th></tr>
        ${E.standings(s, lg.id).map(x => `<tr class="${x.id === s.teamId ? 'me' : ''}"><td>${hasLogo(x) ? `<img class="minilogo" src="${LOGO_IMAGES[x.id]}" width="18" height="18" alt="">` : `<i class="dot" style="background:${x.color}"></i>`}${esc(x.name)}</td><td class="num">${x.w}</td><td class="num">${x.l}</td><td class="num">${(x.w + x.l) ? x.pct.toFixed(3).replace(/^0/, '') : '—'}</td></tr>`).join('')}</table>`).join('');
    }
    return `<div class="sheetback" data-sheet="close"></div><section class="sheet" role="dialog" aria-label="${esc(title)}">
      <div class="sheet-head"><b>${esc(title)}</b><button class="close" data-sheet="close" aria-label="閉じる">×</button></div><div class="sheet-body">${body}</div></section>`;
  }

  /* ---------- 描画とボタン ---------- */
  function render(focus){
    if (!s){ titleScreen(); return; }
    s.seen = s.seen || {};
    if (s.final){ app.innerHTML = finalHTML() + sheetHTML(); bind(); return; }
    const st = E.step(s);
    splash = null;
    if (st && st.month !== shownMonth && !flash){ splash = st.month + '月'; shownMonth = st.month; } // 月が変わった瞬間だけ大きく表示
    if (!flash && !dlg) maybeDialog();
    const main = dlg ? dialogBox(dlg.lines[dlg.i], true) : (flash || stageHTML());
    app.innerHTML = `<div class="game">${hudHTML()}${viewHTML()}<div class="main">${main}</div>${dockHTML()}</div>${sheetHTML()}`;
    toast = null; moneyFx = null;
    bind();
    if (focus === true){ const f = app.querySelector('.main'); if (f) f.scrollIntoView({block:'nearest', behavior:'smooth'}); }
  }
  function bind(){
    app.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => { optPick = b.dataset.opt; render(true); });
    app.querySelectorAll('[data-ans]').forEach(b => b.onclick = () => { pick = +b.dataset.ans; render(true); });
    app.querySelectorAll('[data-rf]').forEach(b => b.onclick = () => { reviewFilter = b.dataset.rf; render('keep'); });
    app.querySelectorAll('[data-sheet]').forEach(b => b.onclick = () => { sheet = b.dataset.sheet === 'close' || sheet === b.dataset.sheet ? null : b.dataset.sheet; render('keep'); });
    app.querySelectorAll('[data-act]').forEach(b => b.onclick = () => {
      const act = b.dataset.act; let focus = true;
      if (act === 'talk'){ dlg.i++; if (dlg.i >= dlg.lines.length) dlg = null; focus = 'keep'; }
      else if (act === 'commit'){ const rec = E.answer(s, pick); pick = null;
        toast = C.instantFeedback ? (rec.ok ? '正解！ その調子。' : '惜しい。' + rec.why) : pickOne(ST.reactions, s.journal.length); }
      else if (act === 'repick'){ pick = null; }
      else if (act === 'decide'){ const before = E.ledger(s, 'user').cash; const wasSpecial = E.step(s).type === 'special'; const chosen = optPick; E.choose(s, optPick); optPick = null; pick = null;
        const tm = (ST.teams || {})[s.teamId]; if (wasSpecial && tm && tm.after && tm.after[chosen]) dlg = {lines: tm.after[chosen], i:0};
        const d = E.ledger(s, 'user').cash - before; if (d) moneyFx = d; }
      else if (act === 'unpick'){ optPick = null; }
      else if (act === 'hint'){
        const q = E.question(s); const key = s.year + ':' + q.qid;
        s.hinted = s.hinted || {};
        if (s.hinted[key]) dlg = {lines:[['senpai:smile', q.hint]], i:0};
        else if (s.hintsLeft > 0){ s.hintsLeft--; s.hinted[key] = true; dlg = {lines:[['senpai:smile', pickOne(ST.hintIntro, s.hintsLeft)], ['senpai:neutral', q.hint]], i:0}; }
        else dlg = {lines: ST.hintUsedUp, i:0};
      }
      else if (act === 'play'){ const r = E.playMonth(s); moneyFx = r.net; flash = paperHTML(r); }
      else if (act === 'next'){ flash = null; }
      else if (act === 'injury'){ const r = E.injure(s); dlg = {lines: r.injured ? ((s.grade || 1) === 1 ? ST.injuryYes : ST.injuryYesNoImpair) : ST.injuryNo, i:0}; }
      else if (act === 'closing'){ const before = E.ledger(s, 'user').cash; E.closing(s); moneyFx = E.ledger(s, 'user').cash - before; }
      else if (act === 'audit'){ s.stepIdx++; }
      else if (act === 'nextYear'){ E.nextYear(s); flash = null; dlg = null; shownMonth = null; window.scrollTo({top:0}); focus = false; }
      else if (act === 'sold'){ s.final = 'sold'; window.scrollTo({top:0}); focus = false; }
      else if (act === 'final'){ s.final = 'done'; window.scrollTo({top:0}); focus = false; }
      else if (act === 'restart'){ years = s.years; grade = s.grade || grade; s = null; dlg = null; flash = null; titleStep = 'team'; window.scrollTo({top:0}); focus = false; }
      else if (act === 'totitle'){ s = null; dlg = null; flash = null; titleStep = 'start'; window.scrollTo({top:0}); focus = false; }
      else if (act === 'again'){ s = E.newGame(s.teamId, undefined, s.years, s.grade); s.seen = {}; flash = null; dlg = null; shownMonth = null; window.scrollTo({top:0}); focus = false; }
      render(focus);
    });
  }

  try { window.claude?.hot?.snapshot?.(() => ({s})); } catch (e) {}
  const start = data => { if (data && data.s){ s = data.s; shownMonth = (E.step(s) || {}).month; } render(); };
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();

if (typeof module !== 'undefined') module.exports = {CONFIG, STORY, Portrait, Engine};
</script>

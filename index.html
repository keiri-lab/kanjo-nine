<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>勘定ナイン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap">
<style>
/* Layout: ゲーム画面。上に固定HUD（資金・暦・メーター）→ 球場ビュー → ゲームウィンドウ（会話・判断・伝票）→ 下に固定の帳簿ドック。
   見た目：スマホの野球ゲーム風。青空の背景に、太い紺の縁取りの白いカード、押せる厚みのあるボタン、丸ゴシックの太字。
   色・太さ・影の深さは下の :root にまとめてある（ここを変えれば全体が変わる）。 */
:root{
  --sky1:#1a9bf0; --sky2:#0d5fc4; --sky3:#083a88;
  --navy:#0b2a63; --ink:#13213a; --dim:#5b6a85; --line:#d3deee; --line2:#b9c9e2;
  --card:#ffffff; --card2:#f2f7ff; --tint:#e6f0ff;
  --yellow:#ffd83d; --yellow2:#fff3b0; --orange:#ff8a00; --orange2:#ffb22c; --orangeink:#8a3d00;
  --red:#e8372c; --red2:#ffe3e1; --redink:#b3241b;
  --green:#1fae5b; --green2:#dff7e8; --greenink:#0f7a3c;
  --blue:#1e6fd9; --blue2:#dbe9ff; --violet:#7b5cff; --violet2:#ece6ff;
  --paper:#fbf6e7; --paper-ink:#1d1a14; --paper-line:#e2d7b8; --stamp:#c8102e;
  --edge:3px;                    /* カードの縁の太さ */
  --lift:0 5px 0 var(--navy);    /* カードの厚み（下の影） */
  --f-display:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  --f-num:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--sky3)}
body{margin:0;font-family:var(--f-body);font-weight:500;font-size:15px;line-height:1.65;color:var(--ink);padding-inline:16px;padding-block:0 100px;
  background:repeating-linear-gradient(115deg,rgba(255,255,255,.045) 0 60px,transparent 60px 120px),linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 45%,var(--sky3) 100%) fixed;min-height:100vh}
#app{max-width:720px;margin-inline:auto}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-family:var(--f-num);font-weight:800;font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
.small{font-size:13px} .dim{color:var(--dim)} .good{color:var(--greenink);font-weight:800}
.portrait{display:block;border-radius:12px;flex:none}
img.portrait{object-fit:cover;background:var(--tint)}
.game{display:flex;flex-direction:column;gap:12px;padding-top:10px}
/* 白い文字に紺の縁取り（青空の上の見出し用） */
.outline{color:#fff;-webkit-text-stroke:6px var(--navy);paint-order:stroke fill}

/* ---------- HUD ---------- */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--card);border:var(--edge) solid var(--navy);border-radius:18px;
  padding:8px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 4px 0 var(--navy),0 10px 22px rgba(4,24,64,.35)}
.hud-row{display:flex;align-items:center;gap:10px;min-width:0}
.emblem{flex:none;width:38px;height:38px;border-radius:50%;background:var(--tc);display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:18px;color:#fff;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),0 0 0 3px var(--navy)}
.hud-team{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.hud-team b{font-size:16px;font-weight:900;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud-team span{font-size:12px;font-weight:700;color:var(--dim)}
.hud-money{position:relative;text-align:right;line-height:1.15;background:linear-gradient(180deg,#ffe97a,var(--yellow) 55%,#ffb800);border:var(--edge) solid var(--navy);border-radius:12px;padding:2px 10px 3px}
.hud-money span{display:block;font-size:10px;font-weight:800;letter-spacing:.1em;color:#6b4200}
.hud-money b{font-size:21px;font-weight:900;color:var(--navy)}
.fx{position:absolute;right:4px;top:calc(100% + 4px);z-index:2;white-space:nowrap;font-style:normal;font-family:var(--f-num);font-weight:900;font-size:15px;
  -webkit-text-stroke:4px #fff;paint-order:stroke fill;animation:floatup 1.6s ease-out forwards;pointer-events:none}
.fx.up{color:var(--greenink)} .fx.down{color:var(--redink)}
@keyframes floatup{0%{opacity:0;transform:translateY(8px)}15%{opacity:1}100%{opacity:0;transform:translateY(-22px)}}
.small-row{justify-content:space-between;flex-wrap:wrap;gap:6px 12px}
.cal{display:flex;gap:3px}
.cal i{width:12px;height:9px;border-radius:3px;background:#dfe7f3}
.cal i.past{background:#b9c6da} .cal i.pw{background:var(--green)} .cal i.pl{background:var(--red)}  /* 勝ち越し月・負け越し月（.win はゲームウィンドウと名前がぶつかるので使わない） */
.cal i.now{background:var(--orange);box-shadow:0 0 0 2px var(--yellow)}
.meters{display:flex;gap:10px}
.mt{display:flex;align-items:center;gap:4px;font-size:11px;font-weight:800;color:var(--dim)}
.mt b{font-family:var(--f-num);font-weight:900;color:var(--navy);font-size:13px;min-width:1.6em;text-align:right}
.mt i{width:42px;height:7px;border-radius:99px;background:#dfe7f3;overflow:hidden;display:block;box-shadow:inset 0 0 0 1px #c6d3e6}
.mt u{display:block;height:100%;background:var(--blue);text-decoration:none;border-radius:99px}
.mt.fat u{background:var(--red)}

/* ---------- 球場ビュー ---------- */
.viewwrap{position:relative}
.view{border-radius:18px;overflow:hidden;background:#0b1730;position:relative;border:var(--edge) solid #fff;box-shadow:0 0 0 2px var(--navy),0 6px 0 var(--navy)}
.view svg{display:block;width:100%;height:auto}
.view .cap{position:absolute;left:10px;bottom:8px;font-size:11.5px;font-weight:800;color:var(--navy);background:#fff;border:2px solid var(--navy);padding:1px 10px;border-radius:99px}
.splash{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;
  background:radial-gradient(closest-side,rgba(8,40,110,.45),rgba(8,40,110,0));animation:splash 1.8s ease-out forwards;border-radius:18px}
.splash span{font-size:14px;font-weight:900;letter-spacing:.25em;color:var(--yellow);-webkit-text-stroke:4px var(--navy);paint-order:stroke fill}
.splash b{font-family:var(--f-display);font-weight:900;font-size:clamp(52px,15vw,90px);line-height:1;color:#fff;-webkit-text-stroke:10px var(--navy);paint-order:stroke fill;
  text-shadow:0 6px 0 var(--navy)}
@keyframes splash{0%{opacity:0;transform:scale(1.3)}18%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0}}

/* ---------- 会話 ---------- */
.dialog{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start;text-align:left;width:100%;
  background:var(--card);border:var(--edge) solid var(--navy);border-radius:20px;padding:12px;box-shadow:var(--lift);margin-bottom:12px}
button.dialog:hover{background:#fffdf2}
button.dialog:active{transform:translateY(3px);box-shadow:0 2px 0 var(--navy)}
.dface .portrait{border-radius:16px;box-shadow:0 0 0 3px #fff,0 0 0 5px var(--nc),0 4px 0 5px var(--navy)}
.dtext{min-width:0;display:flex;flex-direction:column;gap:6px}
.name{align-self:flex-start;background:var(--nc);color:#fff;font-weight:900;font-size:13px;padding:2px 12px;border-radius:99px;border:2px solid var(--navy);transform:skewX(-8deg)}
.name small{font-weight:700;opacity:.9;margin-left:8px;font-size:11px}
.dialog p{font-size:16px;font-weight:700;line-height:1.8;color:var(--ink)}
.next{align-self:flex-end;font-size:12px;font-weight:900;color:var(--orange);animation:blink 1.1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: no-preference){button.dialog p{animation:say .22s ease-out}@keyframes say{from{opacity:.3;transform:translateY(3px)}to{opacity:1;transform:none}}}

/* ---------- ゲームウィンドウ ---------- */
.main{scroll-margin-top:110px}
.win{background:var(--card);border:var(--edge) solid var(--navy);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--lift),0 14px 30px rgba(4,24,64,.3)}
.win h2{font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1.3;color:var(--navy)}
.win h3{font-size:14px;font-weight:900;color:var(--navy);margin-top:4px;padding-left:10px;border-left:5px solid var(--orange)}
.lead{color:var(--ink);font-weight:700}
.note{font-size:13px;font-weight:800;color:var(--redink)}
.ribbon{align-self:flex-start;margin-top:-30px;margin-left:-4px;font-size:13px;font-weight:900;letter-spacing:.06em;padding:3px 16px;color:#fff;background:var(--red);
  border:var(--edge) solid #fff;box-shadow:0 0 0 2px var(--navy),0 4px 0 2px var(--navy);transform:skewX(-12deg)}
.ribbon span{display:inline-block;transform:skewX(12deg)}
.ribbon.ev{background:var(--red)} .ribbon.plan{background:var(--blue)} .ribbon.inc{background:#f06a00} .ribbon.q{background:var(--green)} .ribbon.play{background:#9b3fe0}
.ribbon.team{background:linear-gradient(90deg,#ff6a3d,#ffb22c)}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;background:var(--card2);border:var(--edge) solid var(--navy);border-radius:16px;padding:12px 14px;
  display:flex;flex-direction:column;gap:7px;box-shadow:0 4px 0 var(--navy);transition:transform .1s,box-shadow .1s,background .1s}
.choice:hover{background:#fffbe6}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.choice b{font-size:17px;font-weight:900;color:var(--navy)}
.key{width:auto;height:auto;padding:1px 12px;border-radius:99px;background:var(--navy);color:#fff;font-weight:900;font-size:12px;display:inline-grid;place-items:center}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12.5px;font-weight:800;padding:1px 10px;border-radius:99px;background:var(--tint);color:var(--navy)}
.chip.pos{background:var(--green2);color:var(--greenink)}
.chip.neg{background:var(--red2);color:var(--redink)}
.slip{background:var(--paper);color:var(--paper-ink);border-radius:12px;padding:10px 14px 12px;position:relative;border:var(--edge) solid var(--navy);
  background-image:repeating-linear-gradient(180deg,transparent 0 27px,var(--paper-line) 27px 28px);box-shadow:0 4px 0 var(--navy)}
.slip-head{display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:800;letter-spacing:.1em;color:#6b6250;margin-bottom:4px}
.stamp{color:var(--stamp);border:2px solid var(--stamp);border-radius:6px;padding:0 6px;transform:rotate(-8deg);font-weight:900;letter-spacing:.05em;background:rgba(255,255,255,.6)}
.slip p{font-size:15.5px;font-weight:700;line-height:1.85}
.slip.small{padding:8px 12px}
.confirm{border:var(--edge) solid var(--orange);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:#fff8dc;box-shadow:0 4px 0 #c26a00}
.clabel{align-self:flex-start;font-size:12px;font-weight:900;color:#fff;background:var(--orange);border-radius:99px;padding:1px 12px}
.cname{font-size:18px;font-weight:900;color:var(--navy)}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{border:var(--edge) solid var(--navy);background:#fff;color:var(--navy);border-radius:14px;padding:10px 18px;font-weight:900;box-shadow:0 4px 0 var(--navy)}
.btn:hover{background:var(--card2)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--navy)}
.btn.primary{flex:1;min-width:10em;font-size:17px;color:#fff;background:linear-gradient(180deg,var(--orange2),var(--orange));-webkit-text-stroke:4px var(--orangeink);paint-order:stroke fill}
.btn.primary:hover{background:linear-gradient(180deg,#ffc24f,#ff9a1a)}
.bigplay{display:flex;flex-direction:column;align-items:center;gap:2px;padding:18px;border-radius:20px;border:var(--edge) solid var(--navy);
  background:linear-gradient(180deg,#ff5a4a,var(--red));color:#fff;box-shadow:0 6px 0 var(--navy),0 14px 30px rgba(232,55,44,.35)}
.bigplay span{font-family:var(--f-display);font-weight:900;font-size:34px;letter-spacing:.06em;line-height:1.1;-webkit-text-stroke:7px var(--navy);paint-order:stroke fill}
.bigplay small{font-weight:800}
.bigplay:active{transform:translateY(4px);box-shadow:0 2px 0 var(--navy)}
.advisors{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}
.adv{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:start;background:var(--card2);border:2px solid var(--line2);border-radius:14px;padding:8px;font-size:13.5px;font-weight:700;line-height:1.6}
.adv .portrait{border-radius:50%;box-shadow:0 0 0 2px var(--navy)}
.adv b{display:block;font-size:11px;font-weight:900;color:var(--red)}
.hintbtn{align-self:flex-start;display:flex;align-items:center;gap:8px;background:var(--violet2);color:var(--navy);border:var(--edge) solid var(--navy);border-radius:99px;padding:3px 14px 3px 3px;
  font-weight:900;font-size:14px;box-shadow:0 3px 0 var(--navy)}
.hintbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--navy)}
.hintbtn .portrait{border-radius:50%}
.hintbtn em{font-style:normal;font-size:12px;font-weight:900;color:#fff;background:var(--violet);border-radius:99px;padding:0 8px}
.react{display:flex;align-items:center;gap:8px;align-self:flex-start;background:#fff;color:var(--ink);border:var(--edge) solid var(--navy);border-radius:16px;padding:5px 14px 5px 5px;
  font-size:14px;font-weight:800;position:relative;box-shadow:0 3px 0 var(--navy)}
.react .portrait{border-radius:50%}
.bignum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.bignum span{font-size:12px;font-weight:800;color:var(--dim)} .bignum b{font-size:34px;font-weight:900} .bignum b.ok{color:var(--greenink)} .bignum b.ng{color:var(--redink)} .bignum small{font-weight:700;color:var(--dim)}

/* ---------- 新聞 ---------- */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;border:var(--edge) solid var(--navy);
  box-shadow:var(--lift),0 14px 30px rgba(4,24,64,.3);margin-bottom:12px;transform:rotate(-.6deg)}
.paper .mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:3px double var(--paper-ink);padding-bottom:4px;font-size:12px;font-weight:700}
.paper .mast b{font-family:var(--f-display);font-weight:900;font-size:18px;letter-spacing:.06em}
.paper .head{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,7.5vw,40px);line-height:1.15;color:var(--stamp)}
.paper .sub{font-weight:800}
.pbody{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;font-size:13px;font-weight:700}
.pquote{display:flex;gap:10px;align-items:flex-start}
.pbox{border:2px solid var(--paper-ink);border-radius:6px;padding:6px 8px;background:rgba(255,255,255,.5)}
.pbox b{display:block;font-size:11px;margin-bottom:2px}
.result{display:grid;grid-template-columns:1fr auto;gap:1px 12px}
.result .num{text-align:right}
.result .total{border-top:1.5px solid currentColor;padding-top:3px;font-weight:900}
@media (max-width:520px){.pbody{grid-template-columns:1fr}}

/* ---------- 表・監査 ---------- */
.ledger{width:100%;border-collapse:collapse;font-size:13px;font-weight:700}
.ledger th{white-space:nowrap;font-weight:900;color:#fff;background:var(--navy);text-align:left;padding:4px 6px;font-size:12px}
.ledger th:first-child{border-radius:8px 0 0 0} .ledger th:last-child{border-radius:0 8px 0 0}
.ledger td{border-bottom:1.5px solid var(--line);padding:5px 6px;vertical-align:top}
.ledger td.num,.ledger th.num{text-align:right;white-space:nowrap}
.ledger tr.total td{border-bottom:3px double var(--navy);border-top:2px solid var(--navy);font-weight:900;color:var(--navy);background:var(--tint)}
.ledger tr.me td{background:var(--yellow2);font-weight:900}
.ledger .sub td{color:var(--dim)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;box-shadow:0 0 0 1.5px var(--navy)}
.fs{display:grid;grid-template-columns:1fr;gap:14px}
.fs h3{font-size:14px;font-weight:900;color:var(--navy);margin-bottom:4px}
.scroll{overflow-x:auto}
.finding{border:2px solid #f3b3ad;border-left:6px solid var(--red);padding:8px 12px;background:#fff4f3;border-radius:12px;display:flex;flex-direction:column;gap:6px;font-weight:700}
.finding .lbl{align-self:flex-start;font-size:11px;font-weight:900;color:#fff;background:var(--dim);border-radius:99px;padding:0 8px}
.gradebox{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.gradebox span{font-size:13px;font-weight:800;color:var(--dim)}
.grade{font-family:var(--f-display);font-weight:900;font-size:72px;line-height:1;-webkit-text-stroke:8px var(--navy);paint-order:stroke fill;text-shadow:0 5px 0 var(--navy)}
.grade.gS{color:var(--yellow)} .grade.gA{color:#3fd47f} .grade.gB{color:#5aa2ff} .grade.gC{color:#c9a0ff} .grade.gD{color:#ff6b61}
.gradebox small{font-weight:800;color:var(--dim)}
.scoregrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.scoregrid div{background:var(--card2);border:2px solid var(--navy);border-radius:12px;padding:6px 10px;box-shadow:0 3px 0 var(--navy)}
.scoregrid span{display:block;font-size:11px;font-weight:800;color:var(--dim)}
.scoregrid b{display:block;font-family:var(--f-num);font-weight:900;font-size:24px;color:var(--navy)}

/* ---------- 帳簿ドックと引き出し ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);gap:5px;
  padding:8px max(16px,calc((100% - 720px)/2)) calc(10px + env(safe-area-inset-bottom,0px));
  background:#fff;border-top:var(--edge) solid var(--navy);box-shadow:0 -6px 18px rgba(4,24,64,.25)}
.dockbtn{display:flex;flex-direction:column;align-items:center;line-height:1.25;background:var(--card2);color:var(--navy);border:2.5px solid var(--navy);border-radius:12px;padding:5px 4px;box-shadow:0 3px 0 var(--navy)}
.dockbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--navy)}
.dockbtn b{font-size:13px;font-weight:900} .dockbtn small{font-size:10px;font-weight:700;color:var(--dim)}
.dockbtn.on{background:var(--yellow)}
.sheetback{position:fixed;inset:0;z-index:40;background:rgba(4,20,56,.55)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:78vh;display:flex;flex-direction:column;
  margin-inline:auto;max-width:720px;background:var(--card);border:var(--edge) solid var(--navy);border-bottom:0;border-radius:22px 22px 0 0;
  box-shadow:0 -12px 40px rgba(4,20,56,.5);animation:sheetup .22s ease-out}
@keyframes sheetup{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:2px solid var(--line);background:var(--card2);border-radius:20px 20px 0 0}
.sheet-head b{font-family:var(--f-display);font-weight:900;font-size:18px;color:var(--navy)}
.close{background:#fff;color:var(--navy);border:2.5px solid var(--navy);border-radius:10px;width:36px;height:36px;font-size:20px;font-weight:900;line-height:1;box-shadow:0 3px 0 var(--navy)}
.sheet-body{overflow:auto;padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
.sheet-body h3{font-size:14px;font-weight:900;color:var(--navy)}
.jrow{display:grid;grid-template-columns:3em 1fr;gap:4px 10px;padding-block:8px;border-bottom:1.5px solid var(--line)}

/* ==========================================================
   エンジン：ゲームの進行と帳簿の計算（画面には触れない）
   「正しい帳簿」と「あなたの帳簿」を並行して持ち、監査で突き合わせる。
   翌期は監査で修正された（正しい）残高から始まる。
   ========================================================== */
const Engine = (() => {
  const C = CONFIG;
  const ACC = Object.fromEntries(C.accounts.map(a => [a.id, a]));
  const team = id => C.teams.find(t => t.id === id);
  const YEARS = C.years; // 既定の期数（画面で 3・5・10 期から選べる）

  const ev = (id, month, cond) => ({type:'event', id, month, cond});
  const play = month => ({type:'play', month});
  const Q = (id, month, cond) => ({type:'question', id, month, cond});
  const G = s => s.grade || 1;
  const activeContracts = s => s.reg.contracts.filter(c => c.remaining > 0 && c.book > 0);
  const injury = {type:'injury', month:8, cond: s => !!s.newFA};
  const thisYear = key => s => !!s.reg[key] && s.reg[key].year === s.year;
  const owned = key => s => s.reg.fixed.some(f => f.key === key);
  const notOwned = key => s => !owned(key)(s);
  const leaseDue = s => !!s.reg.lease && s.reg.lease.debt > 0 && s.year > s.reg.equip.year;
  // 月初の自動処理：未払金・預り金などの支払日が来たら払う
  const autoPay = month => ({type:'auto', month, cond: s => s.reg.due.some(d => d.month === month), run: s => {
    s.reg.due.filter(d => d.month === month).forEach(d => post(s, month, d.title, pair(d.acct, 'cash', d.amt)));
    s.reg.due = s.reg.due.filter(d => d.month !== month);
  }});
  // 期ごとの決まったイベント（月 → 進行）。級によって中身が変わる（級の範囲外の取引は、別の取引に置き換える）。
  // 4〜9月は毎月「作戦会議 → 試合 → 月末の出来事」が自動で入る。見送ったイベントや契約が切れたものは、後の期にもう一度出る。
  function fixedFor(y, g){
    const F = {};
    F[1] = g === 3 ? [y % 2 ? ev('machine3', 1, notOwned('machine3')) : ev('bus3', 1, notOwned('bus3'))] : [ev('fa', 1)];
    F[1].push(Q('withholding', 1));
    F[2] = g === 1 ? (y >= 3 ? [ev('foreign', 2)] : []) : g === 2 ? (y >= 2 ? [ev('archive2', 2)] : []) : [ev('camp3', 2)];
    F[3] = g === 1 ? [Q('leasePay', 3, leaseDue)] : g === 2 ? [Q('leasePay2', 3, leaseDue)] : [Q('campSettle', 3, s => !!s.reg.camp)];
    F[4] = [];
    if (y % 3 === 1) F[4].push(ev('equip', 4, s => !s.reg.equip || s.reg.equip.returned));   // 1・4・7・10期（未導入なら）
    if (y % 3 === 2) F[4].push(ev('goods', 4));                                               // 2・5・8期
    F[5] = [ev('tv', 5, s => !s.reg.tv || s.reg.tv.yearsLeft <= 0)];                          // 最初の期と、契約が切れたとき
    if (y % 3 === 2) F[6] = [g === 1 ? ev('aro', 6, s => !s.reg.aro) : g === 2 ? ev('build2', 6, notOwned('build2')) : ev('build3', 6, notOwned('build3'))]; // 2・5・8期（未建設なら）
    return F;
  }
  function tailFor(g){
    const list = [Q('seasonEnd', 10)];
    if (g === 1) list.push(Q('fxAccrue', 10, s => !!s.reg.fx));
    list.push(Q('sponsorCredit', 10), autoPay(11), ev('seats', 11), {type:'closing', month:12});
    if (g !== 3) list.push(Q('amort', 12, s => activeContracts(s).length > 0));
    if (g === 1) list.push(Q('impair', 12, s => s.injured));
    if (g === 3) list.push(Q('dep3', 12, s => depItems(s).length > 0), Q('registerClose', 12, s => s.reg.cashDiff > 0));
    if (g !== 3) list.push(Q('goodsEval', 12, s => !!s.reg.goods && s.reg.goods.year === s.year && s.reg.goods.left > 0));
    if (g === 1) list.push(Q('fxEval', 12, s => !!s.reg.fx));
    if (g === 2) list.push(Q('fxEval2', 12, s => !!s.reg.fx2));
    list.push(Q('allowance', 12, s => allowDiff(s) > 0), Q('allowanceRev', 12, s => allowDiff(s) < 0));
    if (g !== 3) list.push(Q('bonusProv', 12));
    list.push(Q('prepaid', 12, thisYear('ins')), Q('unearned', 12, s => thisYear('fc')(s) && s.reg.fc.fee > 0), Q('provision', 12, thisYear('prov')),
      {type:'statements', month:12}, {type:'audit', month:12});
    return list;
  }
  function buildSchedule(y, g){
    const F = fixedFor(y, g), list = [];

    for (let m = 4; m <= 9; m++){
      list.push(autoPay(m), ...(F[m] || []));
      if (m === 8) list.push(injury);
      list.push({type:'policy', month:m}, play(m), {type:'incident', month:m, cond: s => !!s.incidents[m]});
      if (y === 2 && m === 7) list.push({type:'special', month:7, cond: s => !!(C.teamEvents && C.teamEvents[s.teamId])}); // 球団ごとの出来事

  const SCHEDULES = {};

    const k = G(s) + ':' + s.year; return SCHEDULES[k] || (SCHEDULES[k] = buildSchedule(s.year, G(s))); };

  const newReg = () => ({contracts:[], equip:null, lease:null, tv:null, goods:null, aro:null, fx:null, fxPay:0, renov:[], ins:null, fc:null, prov:null, nextSeats:0,
    fixed:[], due:[], ar:0, fx2:null, allow:0, bonus:0, cashDiff:0, camp:null});
  function newGame(teamId, seed, years, grade){
    const t = team(teamId);
    const s = {teamId, seed: seed ?? Math.floor(Math.random() * 1e9), rngN:0, year:1, years: years || YEARS, grade: grade || C.defaultGrade || 1,
      fansBonus:0, fanCarry:0, history:[], qQueue:[],
      basePower: Object.fromEntries(C.teams.map(x => [x.id, x.power])), reg:newReg()};
    s.opening = {cash:t.cash, advance:-t.seats, capital:-C.capital, retained:-(t.cash - t.seats - C.capital)};
    startYear(s, t.seats);
    return s;
  }
  function startYear(s, seats){
    s.stepIdx = 0; s.choices = {}; s.ctx = {seats}; s.journal = []; s.line = {}; s.pendingQ = null;
    s.standings = {}; C.teams.forEach(x => s.standings[x.id] = {w:0, l:0});
    s.injured = false; s.newFA = null; s.hintsLeft = C.hintsPerYear;
    s.fatigue = 0; s.monthMod = null; s.nextMod = null; s.beer = null; s.lastTicket = 0;
    if (s.reg.fx) s.reg.fx = null; // 外国人選手は単年契約
    // 月末の出来事を6つ選んで4〜9月に割り当てる（保険の更新は事故より前に置く。級の範囲外の出来事は出さない）
    const pool = Object.keys(C.incidents).filter(k => okGrade(C.incidents[k], G(s)));
    for (let i = pool.length - 1; i > 0; i--){ const j = Math.floor(rand(s) * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    const picked = pool.slice(0, 6); const iA = picked.indexOf('accident'), iI = picked.indexOf('insurance');
    if (iA >= 0 && iI >= 0 && iA < iI){ picked[iA] = 'insurance'; picked[iI] = 'accident'; }
    s.incidents = {}; picked.forEach((id, k) => s.incidents[4 + k] = id);
    // 作戦会議の候補：毎月「いつもどおり」＋ほかから2つ
    s.policyOffers = {};
    for (let m = 4; m <= 9; m++){
      const rest = Object.keys(C.policies).filter(k => k !== 'normal');
      for (let i = rest.length - 1; i > 0; i--){ const j = Math.floor(rand(s) * (i + 1)); [rest[i], rest[j]] = [rest[j], rest[i]]; }
      s.policyOffers[m] = ['normal', rest[0], rest[1]];
    }
    // 前期末の経過勘定と引当金を、期首に戻す（再振替・取崩し）
    const r = s.reg;
    if (r.ins && r.ins.prepaid){ post(s, 1, '期首の再振替（前払保険料）', pair('exp_insurance', 'prepaid', r.ins.prepaid)); }
    if (r.fc && r.fc.unearned){ post(s, 1, '期首の再振替（前受会費）', pair('unearned', 'rev_fanclub', r.fc.unearned)); }
    if (r.prov && r.prov.amt){ post(s, 1, '訴訟の判決どおり賠償金を支払い、引当金を取り崩し', pair('provision', 'cash', r.prov.amt)); }
    if (r.fxPay){ post(s, 1, '外国人選手の前期の年俸を支払い（前期末のレートと同じ）', pair('payable', 'cash', r.fxPay)); r.fxPay = 0; }
    const arIn = r.ar + (r.fx2 ? r.fx2.jpy : 0);
    if (arIn){ post(s, 1, '前期の売掛金を回収' + (r.fx2 ? '（ドル建て分は前期末のレートと同じ）' : ''), pair('cash', 'receivable', arIn)); r.ar = 0; r.fx2 = null; }
    if (r.bonus){ post(s, 1, '職員に賞与を支給し、賞与引当金を取り崩し', pair('bonusProv', 'cash', r.bonus)); r.bonus = 0; }
    r.ins = null; r.fc = null; r.prov = null; s.qQueue = [];
    skip(s);
  }
  // 条件に合わない進行は飛ばし、自動処理（type:'auto'）はその場で実行して先へ進む
  function skip(s){
    const sc = schedule(s);
    while (s.stepIdx < sc.length){
      const st = sc[s.stepIdx];
      if (st.cond && !st.cond(s)){ s.stepIdx++; continue; }
      if (st.type === 'auto'){ st.run(s); s.stepIdx++; continue; }
      break;
    }
  }
  function advance(s){ s.stepIdx++; skip(s); }
  const step = s => schedule(s)[s.stepIdx];
  const target = s => team(s.teamId).target + C.targetStep * Math.min(s.year - 1, C.targetStepMax ?? 99);
  const fans = s => team(s.teamId).fans + s.fansBonus + s.fanCarry;
  const contractById = (s, id) => s.reg.contracts.find(c => c.id === id);
  function power(s){
    let p = s.basePower[s.teamId];
    s.reg.contracts.forEach(c => { if (s.year < c.year + 3 && !c.out) p += c.power; });
    if (s.reg.aro) p += C.aro.power;
    s.reg.fixed.forEach(f => p += f.power || 0);
    if (s.reg.fx) p += s.reg.fx.power;
    p -= (s.fatigue || 0) * C.fatiguePower;
    return p;
  }
  const salaryYear = s => team(s.teamId).payroll + s.reg.contracts.filter(c => s.year < c.year + 3).reduce((t, c) => t + c.salary, 0);

  /* ---------- 仕訳の形をそろえる ---------- */
  const val = (amt, ctx) => typeof amt === 'number' ? amt : ctx[amt];
  const fill = (str, ctx) => (str || '').replace(/\{(\w+)\}/g, (_, k) => ctx[k] != null ? (typeof ctx[k] === 'number' ? ctx[k].toLocaleString('ja-JP') : ctx[k]) : k);
  function resolve(e, ctx){
    if (e.none) return {none:true};
    const raw = e.lines ? e.lines : [['dr', e.dr, e.amt], ['cr', e.cr, e.amt]];
    const lines = raw.map(([side, acct, amt]) => {
      const v = val(amt, ctx);
      if (!Number.isFinite(v)) throw new Error('金額が未定義: ' + amt);
      if (!ACC[acct] && ACC[ctx[acct]]) acct = ctx[acct]; // 科目を ctx から決める問題（例：assetAcct → 備品／車両運搬具）
      if (!ACC[acct]) throw new Error('科目が未定義: ' + acct);
      return {side, acct, amt: Math.round(v)};
    }).filter(l => l.amt !== 0);
    const dr = lines.filter(l => l.side === 'dr').reduce((t, l) => t + l.amt, 0);
    const cr = lines.filter(l => l.side === 'cr').reduce((t, l) => t + l.amt, 0);
    if (dr !== cr) throw new Error('貸借不一致: ' + JSON.stringify(lines));
    return {lines};
  }
  function post(s, month, title, lines){
    lines = lines.map(([side, acct, amt]) => ({side, acct, amt: Math.round(amt)})).filter(l => l.amt !== 0);
    if (!lines.length) return;
    const e = {lines};
    s.journal.push({month, title, kind:'auto', user:e, correct:e, ok:true});
  }
  const pair = (dr, cr, amt) => [['dr', dr, amt], ['cr', cr, amt]];
  const okGrade = (x, g) => !x.grades || x.grades.includes(g);
  const qOf = (o, g) => (o.q && typeof o.q === 'object' && !Array.isArray(o.q)) ? o.q[g] : o.q; // 級ごとに問題を変える {1:'…', 2:'…'}

  /* ---------- 減価償却の対象（定額法・残存価額ゼロ・月割り） ---------- */
  // 購入した設備・建物・改修。リース（使用権資産）と室内練習場（資産除去債務つき）は決算整理で別に扱う。
  function depItems(s){
    const r = s.reg, E = C.equip, list = [];
    const add = (ref, label, acctName, cost, life, start) => {
      const first = ref.year === s.year, months = first ? 13 - start : 12;
      const full = Math.min(cost / life, cost - ref.dep), amt = Math.min(cost / life * months / 12, cost - ref.dep);
      if (amt > 0) list.push({ref, label, acctName, cost, life, months, first, start, amt: Math.round(amt), full: Math.round(full)});
    };
    if (r.equip && (r.equip.mode === 'buy' || r.equip.mode === 'credit')) add(r.equip, 'LED照明', '備品', r.equip.cost, E.life, 4);
    r.fixed.forEach(f => add(f, f.name, ACC[f.acct].name, f.cost, f.life, f.start));
    r.renov.forEach(v => add(v, '改修したスタンド', '建物', v.cost, 20, v.month + 1));
    return list;
  }
  const arTotal = s => s.reg.ar + (s.reg.fx2 ? s.reg.fx2.jpy : 0);
  const allowDiff = s => Math.round(arTotal(s) * C.sponsorAr.rate) - s.reg.allow;

  /* ---------- 問題ごとの金額の準備と、正しい処理の反映 ---------- */
  function prep(s, qid){
    const x = s.ctx, r = s.reg, F = C.fx;
    if (qid === 'amort'){
      const list = activeContracts(s);
      x.amortList = list.map(c => ({id:c.id, amt: Math.round(c.book / c.remaining)}));
      x.amort = x.amortList.reduce((t, a) => t + a.amt, 0);
      x.amortAll = list.reduce((t, c) => t + c.book, 0);
      x.amortDetail = '内訳：' + list.map((c, i) => `第${c.year}期に契約した${c.label}（期首の帳簿価額${c.book}・残り${c.remaining}年）`).join('、') + '。';
    }
    if (qid === 'impair'){
      const c = contractById(s, s.newFA);
      x.bookAfter = c.book; x.recov = c.recov; x.impair = c.book - c.recov;
    }
    if (qid === 'leasePay'){
      const L = r.lease;
      x.leaseDebt = L.debt; x.leasePmt = C.equip.leasePayment; x.leaseInt = Math.round(L.debt * C.equip.leaseRate);
      if (L.debt + x.leaseInt <= x.leasePmt + 1) x.leaseInt = x.leasePmt - L.debt; // 最終回：端数を利息で調整し、元本をちょうどゼロにする
      x.leaseAccr = L.accrued; x.leaseIntNow = x.leaseInt - L.accrued; x.leasePrin = x.leasePmt - x.leaseInt;
      x.leaseRatePct = (C.equip.leaseRate * 100).toFixed(2);
    }
    if (qid === 'goodsEval'){
      x.goodsLeft = r.goods.left; x.goodsNRV = Math.round(r.goods.left * C.goods.nrvRate); x.goodsLoss = x.goodsLeft - x.goodsNRV;
    }
    if (qid === 'aro'){ x.aroCost = C.aro.cost; x.aroPV = C.aro.pv; x.aroTotal = C.aro.cost + C.aro.pv; }
    if (qid === 'repairCap') x.repairHalf = x.repair / 2;
    if (qid === 'prepaid'){
      const m = r.ins.month; x.insMonth = m; x.ins = r.ins.cost; x.insPerMonth = r.ins.cost / 12;
      x.insThisMonths = 12 - m; x.insNextMonths = m; x.insThis = r.ins.cost * (12 - m) / 12; x.insPrepaid = r.ins.cost * m / 12;
    }
    if (qid === 'unearned'){
      const m = r.fc.month; x.fcMonth = m; x.fc = r.fc.fee; x.fcPerMonth = r.fc.fee / 12;
      x.fcThisMonths = 12 - m; x.fcNextMonths = m; x.fcThis = r.fc.fee * (12 - m) / 12; x.fcUnearned = r.fc.fee * m / 12;
    }
    if (qid === 'provision') x.prov = r.prov.amt;
    if (qid === 'withholding'){ x.wage = C.wages.gross; x.wh = C.wages.withholding; x.wageNet = x.wage - x.wh; }
    if (qid === 'dep3'){
      const list = depItems(s); x.depList = list;
      x.depTotal = list.reduce((t, i) => t + i.amt, 0); x.depFull = list.reduce((t, i) => t + i.full, 0);
      x.depDetail = '対象：' + list.map(i => `${i.label}（${i.acctName}）取得原価${i.cost}・耐用年数${i.life}年・${i.first ? `今期${i.start}月1日から使用` : '前期以前から使用'}`).join('、') + '。';
    }
    if (qid === 'registerClose') x.cd = r.cashDiff;
    if (qid === 'karibarai' || qid === 'campSettle'){ x.campAdv = r.camp.adv; x.campActual = r.camp.actual; x.campRefund = r.camp.adv - r.camp.actual; }
    if (qid === 'sponsorCredit'){ const A = C.sponsorAr; x.ar = Math.max(A.unit, Math.round(fans(s) * A.perFan / A.unit) * A.unit); }
    if (qid === 'allowance' || qid === 'allowanceRev'){
      x.ar = arTotal(s); x.ratePct = C.sponsorAr.rate * 100; x.allowBal = r.allow;
      x.allowTarget = Math.round(x.ar * C.sponsorAr.rate); x.allowDiff = x.allowTarget - r.allow; x.allowDiffAbs = Math.abs(x.allowDiff);
    }
    if (qid === 'settle') x.settleAmt = C.accident.settle;
    if (qid === 'bonusProv') x.bonus = C.bonus.amount;
    if (qid === 'lease2' || qid === 'leasePay2'){
      const L2 = C.lease2; x.lease2Pmt = L2.payment; x.lease2Total = L2.total;
      x.lease2Int = (L2.total - C.equip.cost) / C.equip.leaseYears; x.lease2Prin = L2.payment - x.lease2Int; // 誤答用：利子抜き法（定額）の分け方
    }
    if (['subsidyRecv', 'build2', 'compress'].includes(qid)){ const B = C.build; x.sub = B.subsidy2; x.cost2 = B.cost2; x.costNet2 = B.cost2 - B.subsidy2; }
    if (qid === 'build3') x.cost3 = C.build.cost3;
    if (['fxSale2', 'yenSale2', 'fxEval2'].includes(qid)){
      const F2 = C.fx2; x.fxR0 = F2.rate0; x.fxR2 = F2.rate2; x.fxUsd = F2.usd * 100; x.yen = F2.yen;
      x.fxJ0 = F2.usd * F2.rate0; x.fxJ2 = F2.usd * F2.rate2; x.fxL2 = Math.abs(x.fxJ2 - x.fxJ0);
    }
    if (['foreignSign', 'fxAccrue', 'fxEval'].includes(qid)){
      x.fxRate0 = F.rate0; x.fxRate1 = F.rate1; x.fxRate2 = F.rate2;
      x.fxJPY0 = F.usd * F.rate0; x.fxJPY1 = F.usd * F.rate1; x.fxJPY2 = F.usd * F.rate2; x.fxLoss = x.fxJPY2 - x.fxJPY1;
    }
  }
  function applyQ(s, qid, month){
    const x = s.ctx, r = s.reg;
    if (qid === 'withholding') r.due.push({month:2, acct:'withholding', amt:x.wh, title:'2月 源泉所得税を税務署に納付'});
    if (qid === 'fixedCredit') r.due.push({month:2, acct:'payable', amt:x.assetCost, title:`2月 ${x.assetName}の代金（未払金）を支払い`});
    if (qid === 'equipCredit') r.due.push({month:5, acct:'payable', amt:C.equip.cost, title:'5月 LED照明の代金（未払金）を支払い'});
    if (qid === 'settle') r.due.push({month:month + 1, acct:'payable', amt:x.settleAmt, title:`${month + 1}月 示談金（未払金）を支払い`});
    if (qid === 'dep3') x.depList.forEach(i => i.ref.dep += i.amt);
    if (qid === 'register') r.cashDiff = x.cd;
    if (qid === 'registerClose') r.cashDiff = 0;
    if (qid === 'campSettle') r.camp = null;
    if (qid === 'sponsorCredit') r.ar += x.ar;
    if (qid === 'yenSale2') r.ar += x.yen;
    if (qid === 'fxSale2') r.fx2 = {jpy:x.fxJ0};
    if (qid === 'fxEval2') r.fx2.jpy = x.fxJ2;
    if (qid === 'allowance' || qid === 'allowanceRev') r.allow = x.allowTarget;
    if (qid === 'bonusProv') r.bonus = x.bonus;
    if (qid === 'leasePay2') r.lease.debt -= x.lease2Pmt;
    if (qid === 'amort') x.amortList.forEach(a => { const c = contractById(s, a.id); c.book -= a.amt; c.remaining--; });
    if (qid === 'impair'){ const c = contractById(s, s.newFA); c.book = c.recov; }
    if (qid === 'leasePay'){ r.lease.debt -= x.leasePrin; r.lease.accrued = 0; }
    if (qid === 'goodsEval') r.goods.left = x.goodsNRV;
    if (qid === 'fxEval') r.fxPay = x.fxJPY2;
    if (qid === 'prepaid') r.ins.prepaid = x.insPrepaid;
    if (qid === 'unearned') r.fc.unearned = x.fcUnearned;
  }

  function makeQ(s, qid, title){
    prep(s, qid);
    const q = C.questions[qid];
    const opts = [{entry:resolve(q.correct, s.ctx), correct:true}];
    const seen = new Set([JSON.stringify(opts[0].entry)]);
    for (const w of q.wrong.concat(q.alt || [])){ // 金額しだいで誤答が正解と同じ形になることがあるので、重複は予備と差し替える
      if (opts.length >= 1 + q.wrong.length) break;
      const entry = resolve(w, s.ctx); const key = JSON.stringify(entry);
      if (seen.has(key)) continue; seen.add(key);
      opts.push({entry, correct:false, why:fill(w.why, s.ctx)});
    }
    for (let i = opts.length - 1; i > 0; i--){ const j = Math.floor(rand(s) * (i + 1)); [opts[i], opts[j]] = [opts[j], opts[i]]; }
    return {qid, title: q.title || title, prompt: fill(q.prompt, s.ctx), explain: fill(q.explain, s.ctx), hint: fill(q.hint, s.ctx), options: opts};
  }
  function question(s){
    const st = step(s);
    if (!s.pendingQ && st && st.type === 'question') s.pendingQ = makeQ(s, st.id, C.questions[st.id].title);
    return s.pendingQ;
  }

  // 今の進行の「選択肢つき画面」の中身を返す
  function eventDef(s){
    const st = step(s); if (!st) return null;
    if (st.type === 'event'){ const e = C.events[st.id]; return {kind:'event', ...e, options: e.options.filter(o => okGrade(o, G(s)))}; }
    if (st.type === 'policy') return {kind:'policy', title: st.month + '月の作戦会議', text:'今月の方針を決める。選んだ方針は今月の試合と売上に効く。',
      options: s.policyOffers[st.month].map(id => ({id, ...C.policies[id]}))};
    if (st.type === 'special'){ const d = C.teamEvents[s.teamId]; return {kind:'special', title:d.title, text:d.text, options:d.options}; }
    if (st.type === 'incident'){
      const id = s.incidents[st.month], d = C.incidents[id];
      const insured = id === 'accident' && s.reg.ins && s.reg.ins.year === s.year;
      return {kind:'incident', id, title:d.title, text: d.text + (insured ? '施設賠償保険に入っている。' : ''), options: (insured ? d.insured : d.options).filter(o => okGrade(o, G(s)))};
    }
    return null;
  }
  function chooseSeason(s, st, o){
    const t = team(s.teamId), r = s.reg, m = st.month, f = fans(s);
    if (st.type === 'policy'){
      s.monthMod = {power:o.power || 0, ticket:o.ticket || 1, goods:o.goods || 1};
      s.fatigue = Math.max(0, (s.fatigue || 0) + (o.fatigue || 0));
      if (o.fans) s.fansBonus += o.fans;
      if (o.grow) s.basePower[s.teamId] += o.grow;
      if (o.cost) post(s, m, `${m}月 ${o.label}の費用`, pair('exp_ads', 'cash', o.cost));
      return null;
    }
    const id = s.incidents[m];
    s.choices['inc' + m] = o.id;
    if (o.effect && o.effect.fans) s.fansBonus += o.effect.fans;
    if (id === 'repair'){
      if (o.repair){ s.ctx.repair = o.repair; if (o.id === 'full') r.renov.push({year:s.year, month:m, cost:o.repair, dep:0}); }
    }
    if (id === 'beer'){
      s.beer = {mode:o.id, from:m};
      const gross = Math.round(f * C.beer.perFan * (0.8 + 0.4 * winPct(s)));
      if (o.id === 'agent'){ s.ctx.beerGross = gross; s.ctx.beerFee = Math.round(gross * C.beer.feeRate); s.ctx.beerCost = gross - s.ctx.beerFee; }
      else postBeer(s, m, gross);
    }
    if (id === 'insurance' && o.id === 'join'){
      r.ins = {year:s.year, month:m, cost:C.insurance.cost, prepaid:0};
      post(s, m, `${m}月 施設賠償保険料（翌月から1年分）`, pair('exp_insurance', 'cash', C.insurance.cost));
    }
    if (id === 'fanclub'){
      r.fc = {year:s.year, month:m, fee:o.fee, unearned:0};
      if (o.fee) post(s, m, `${m}月 ファンクラブ年会費（翌月から1年分）`, pair('cash', 'rev_fanclub', o.fee));
    }
    if (id === 'accident'){
      if (o.id === 'settle' && !qOf(o, G(s))) post(s, m, `${m}月 観客への賠償金（示談）`, pair('exp_settle', 'cash', C.accident.settle));
      if (o.id === 'visit') post(s, m, `${m}月 けがをした観客への見舞金`, pair('exp_settle', 'cash', C.accident.visit));
      if (o.id === 'fight') r.prov = {year:s.year, amt:C.accident.prov};
    }
    if (id === 'rain' && o.id === 'refund') post(s, m, `${m}月 雨天中止の払い戻し`, pair('rev_ticket', 'cash', Math.round(s.lastTicket * 0.1)));
    if (id === 'register'){ const R = C.register; s.ctx.cd = R.min + Math.floor(rand(s) * (R.max - R.min + 1)); }
    if (id === 'scandal'){
      const pw = {suspend:-3, apologize:-1, protect:0}[o.id];
      if (pw) s.nextMod = {power:pw};
    }
    return qOf(o, G(s)) || null;
  }
  function postBeer(s, m, gross){
    const cost = Math.round(gross * C.beer.directCostRate);
    post(s, m, `${m}月 ビールの販売（直営）`, pair('cash', 'rev_concession', gross));
    post(s, m, `${m}月 ビールの仕入と売り子の人件費`, [['dr', 'exp_cogs', cost], ['dr', 'exp_ops', C.beer.directStaff], ['cr', 'cash', cost + C.beer.directStaff]]);
    return gross - cost - C.beer.directStaff;
  }

  function choose(s, optId){
    const st = step(s);
    if (st.type === 'special'){
      const o = C.teamEvents[s.teamId].options.find(x => x.id === optId), m = st.month;
      s.choices.special = optId;
      if (o.fans) s.fansBonus += o.fans;
      if (o.power) s.basePower[s.teamId] += o.power;
      if (o.cost) post(s, m, `${m}月 ${o.label}`, pair(o.costAcct || 'exp_ads', 'cash', o.cost));
      if (o.income) post(s, m, `${m}月 ${o.label}`, pair('cash', o.incomeAcct || 'rev_other', o.income));
      advance(s); return;
    }
    if (st.type === 'policy' || st.type === 'incident'){
      const d = eventDef(s); const o = d.options.find(x => x.id === optId);
      if (st.type === 'policy') s.choices['pol' + st.month] = optId;
      askAfter(s, chooseSeason(s, st, o), d.title);
      return;
    }
    const e = C.events[st.id]; const o = eventDef(s).options.find(x => x.id === optId); const t = team(s.teamId);
    s.choices[st.id] = optId;
    s.fansBonus += (o.effect && o.effect.fans) || 0;
    const r = s.reg;
    if (st.id === 'fa' && o.fee){
      const c = {id:'c' + s.year, year:s.year, label:o.label.replace('を獲得', ''), fee:o.fee, book:o.fee, remaining:3, power:o.power, salary:o.salary, recov:o.recov, out:false};
      r.contracts.push(c); s.newFA = c.id; s.ctx.fee = o.fee;
    }
    if (st.id === 'equip' && o.id !== 'none'){
      const cost = o.id === 'lease' && G(s) === 2 ? C.lease2.total : C.equip.cost;   // 2級のリースは利子込み法（総額で計上）
      r.equip = {mode:o.id, year:s.year, cost, dep:0, incl: o.id === 'lease' && G(s) === 2};
      if (o.id === 'lease') r.lease = {debt:cost, accrued:0};
    }
    if (st.id === 'camp3'){ r.camp = o.adv ? {adv:o.adv, actual:o.actual} : null; if (o.grow) s.basePower[s.teamId] += o.grow; }
    if (o.fixed){ // 3級の固定資産（ピッチングマシン・バス）
      const F = C[o.fixed];
      r.fixed.push({key:o.fixed, name:F.name, acct:F.acct, cost:F.cost, life:F.life, year:s.year, start:1, dep:0, power:F.power || 0});
      Object.assign(s.ctx, {assetName:F.name, assetCost:F.cost, assetLife:F.life, assetAcct:F.acct, assetAcctName:ACC[F.acct].name});
      if (F.fans) s.fansBonus += F.fans;
    }
    if (st.id === 'build3' && o.id === 'build'){ const B = C.build; r.fixed.push({key:'build3', name:'室内練習場', acct:'building', cost:B.cost3, life:B.life, year:s.year, start:7, dep:0, power:B.power}); }
    if (st.id === 'build2' && o.id === 'build'){ const B = C.build; r.fixed.push({key:'build2', name:'室内練習場（圧縮後）', acct:'building', cost:B.cost2 - B.subsidy2, life:B.life, year:s.year, start:7, dep:0, power:B.power}); }
    if (st.id === 'tv'){ r.tv = {mode:o.id, yearsLeft:3, season:o.season || 0, monthly:o.monthly || 0}; if (o.lump) s.ctx.tv = o.lump; }
    if (st.id === 'goods' && o.cost){ r.goods = {year:s.year, cost:o.cost, left:o.cost}; s.ctx.goodsCost = o.cost; }
    if (st.id === 'aro' && o.id === 'build') r.aro = {year:s.year, total:C.aro.cost + C.aro.pv, liability:C.aro.pv, dep:0};
    if (st.id === 'foreign' && o.id === 'sign') r.fx = {power:o.power};
    if (st.id === 'seats') r.nextSeats = s.ctx.nextSeats = Math.round(t.seats * o.factor * (0.8 + 0.4 * winPct(s)));
    askAfter(s, qOf(o, G(s)), e.title);
  }

  function answer(s, idx){
    const q = s.pendingQ; const ch = q.options[idx]; const cor = q.options.find(o => o.correct);
    const rec = {year:s.year, month: step(s).month, title:q.title, kind:'q', qid:q.qid, prompt:q.prompt, user:ch.entry, correct:cor.entry, ok:ch.correct, why:ch.why || null, explain:q.explain};
    s.journal.push(rec); applyQ(s, q.qid, rec.month); s.pendingQ = null;
    // 復習ノート用：全期の問題を残す（期をまたいでも消さない）。誤答の案にはそれぞれ「なぜ違うか」が付いている
    (s.review = s.review || []).push({...rec, picked:idx, options: q.options.map(o => ({entry:o.entry, correct:o.correct, why:o.why || null}))});
    if (s.qQueue && s.qQueue.length) s.pendingQ = makeQ(s, s.qQueue.shift(), q.title); else advance(s); // 続きの問題があれば続けて出す
    return rec;
  }
  // 選択肢のあとの問題（1問・級ごと・続けて複数）を出す。問題がなければ次へ進む
  function askAfter(s, q, title){
    const list = Array.isArray(q) ? q.slice() : q ? [q] : [];
    if (!list.length){ advance(s); return; }
    s.pendingQ = makeQ(s, list.shift(), title); s.qQueue = list;
  }

  function winPct(s){ const r = s.standings[s.teamId]; return (r.w + r.l) ? r.w / (r.w + r.l) : 0.5; }

  function playMonth(s){
    const m = step(s).month; const t = team(s.teamId); const r = s.reg;
    const mod = s.monthMod || {power:0, ticket:1, goods:1};
    const extra = mod.power + ((s.nextMod && s.nextMod.power) || 0);
    let w = 0, l = 0;
    C.leagues.forEach(lg => {
      const ids = C.teams.filter(x => x.league === lg.id).map(x => x.id);
      const pw = {};
      ids.forEach(id => pw[id] = (id === s.teamId ? power(s) + extra : s.basePower[id]) + (rand(s) - 0.5) * 2 * C.formNoise);
      for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++){
        const a = ids[i], b = ids[j]; const p = 1 / (1 + Math.exp(-(pw[a] - pw[b]) / C.powerScale));
        for (let g = 0; g < C.gamesPerPair; g++){
          const aw = rand(s) < p; const W = aw ? a : b, L = aw ? b : a;
          s.standings[W].w++; s.standings[L].l++;
          if (W === s.teamId) w++; if (L === s.teamId) l++;
        }
      }
    });
    s.line[m] = {w, l};
    const wp = w / (w + l); const f = fans(s);
    const res = {month:m, w, l,
      ticket: Math.round(f * C.ticketPerFan * (0.75 + 0.5 * wp) * mod.ticket),
      goods: Math.round(f * C.goodsPerFan * (0.7 + 0.6 * wp) * mod.goods),
      tv: (r.tv && r.tv.mode === 'monthly' && r.tv.yearsLeft > 0 && m >= 5) ? r.tv.monthly : 0,
      salary: salaryYear(s) / 6, stadium: t.stadium, ops: C.opsPerMonth, special:0, specialCost:0};
    post(s, m, m + '月 入場料（当日券ほか）', pair('cash', 'rev_ticket', res.ticket));
    post(s, m, m + '月 グッズ収入', pair('cash', 'rev_goods', res.goods));
    // 記念ユニフォーム（発注した年は需要に応じて販売、翌年4月に残りを値引き販売）
    if (r.goods && r.goods.left > 0){
      let cost = 0, price = 0;
      if (r.goods.year === s.year){
        const demand = Math.round(f * C.goods.demandPerFan * (0.6 + 0.8 * wp));
        cost = Math.min(r.goods.left, demand); price = Math.round(cost * C.goods.markup);
      } else if (m === 4){ cost = r.goods.left; price = r.goods.left; }
      if (cost > 0){
        post(s, m, m + '月 記念ユニフォームの販売', pair('cash', 'rev_goods', price));
        post(s, m, m + '月 記念ユニフォームの売上原価', pair('exp_cogs', 'goods', cost));
        r.goods.left -= cost; res.special = price; res.specialCost = cost;
      }
    }
    if (res.tv) post(s, m, m + '月 放映権料', pair('cash', 'rev_tv', res.tv));
    // ビール：出来事で決めた月の翌月から（業者委託は手数料、直営は売上と原価）
    res.beer = 0;
    if (s.beer && m > s.beer.from){
      const gross = Math.round(f * C.beer.perFan * (0.8 + 0.4 * wp));
      if (s.beer.mode === 'agent'){ res.beer = Math.round(gross * C.beer.feeRate); post(s, m, m + '月 ビール販売の手数料', pair('cash', 'rev_commission', res.beer)); }
      else res.beer = postBeer(s, m, gross);
    }
    post(s, m, m + '月 選手年俸', pair('exp_salary', 'cash', res.salary));
    post(s, m, m + '月 球場使用料', pair('exp_stadium', 'cash', res.stadium));
    post(s, m, m + '月 球団運営費', pair('exp_ops', 'cash', res.ops));
    res.net = res.ticket + res.goods + res.tv + res.special - res.specialCost - res.salary - res.stadium - res.ops + res.beer;
    res.policy = s.choices['pol' + m] || 'normal';
    s.lastTicket = res.ticket; s.monthMod = null; s.nextMod = null;
    advance(s);
    return res;
  }

  function injure(s){
    const hurt = rand(s) < C.injuryChance + (s.fatigue || 0) * C.fatigueInjury;
    if (hurt){ s.injured = true; contractById(s, s.newFA).out = true; }
    advance(s);
    return {injured:hurt};
  }

  function closingEntries(s){
    const list = []; const r = s.reg; const E = C.equip, A = C.aro;
    const add = (title, lines, tag, ref) => list.push({title, tag, ref, lines: lines.map(([side, acct, amt]) => ({side, acct, amt: Math.round(amt)}))});
    const depCap = (asset, amt) => Math.max(0, Math.min(Math.round(amt), asset.cap - asset.dep)); // 取得原価を超えて償却しない
    // 購入した設備・建物の減価償却（3級は自分で仕訳する問題にするので、ここでは出さない）
    if (G(s) !== 3) depItems(s).forEach(i => add(`${i.label}の減価償却（${i.cost}÷${i.life}年${i.months < 12 ? `×${i.months}/12` : ''}）`, pair('exp_dep', 'accDep', i.amt), 'dep', i.ref));
    if (r.equip && !r.equip.returned && r.equip.mode === 'lease'){
      const first = r.equip.year === s.year, eq = {...r.equip, cap:r.equip.cost}, cost = r.equip.cost;
      const ending = r.lease.debt === 0; // 3月31日に最終回を払い終えた期は1〜3月分だけ
      add(`使用権資産の減価償却（${cost}÷${E.leaseYears}年${first ? '×9/12' : ending ? '×3/12・満了' : ''}）`, pair('exp_dep', 'accDep', depCap(eq, cost / E.leaseYears * (first ? E.months / 12 : ending ? 3 / 12 : 1))), 'dep', r.equip);
      if (!ending && !r.equip.incl) add(`リース料の利息を未払計上（4〜12月分：${r.lease.debt}×7.93%×9/12）`, pair('exp_interest', 'accrued', r.lease.debt * E.leaseRate * 9 / 12), 'leaseInt');
      if (ending) add(`リース期間満了：使用権資産を返却（取得原価${cost}と減価償却累計額${cost}を消す）`, pair('accDep', 'lease', cost), 'leaseReturn');
    }
    if (r.tv && r.tv.mode === 'lump' && r.tv.yearsLeft > 0) add('放映権料のうち今季分を収益へ振替', pair('advance', 'rev_tv', r.tv.season));
    if (r.aro){
      const first = r.aro.year === s.year; const k = first ? A.months / 12 : 1;
      add(`室内練習場の減価償却（${r.aro.total}÷${A.life}年${first ? '×6/12' : ''}）`, pair('exp_dep', 'accDep', depCap({...r.aro, cap:r.aro.total}, r.aro.total / A.life * k)), 'dep', r.aro);
      add(`資産除去債務の利息費用（${r.aro.liability}×4%${first ? '×6/12' : ''}）`, pair('exp_accretion', 'aroDebt', r.aro.liability * A.rate * k), 'aroInt');
    }
    add('オフ期間（1〜3月・10〜12月）の球団運営費', pair('exp_ops', 'cash', C.opsPerMonth * 6));
    return list.map(e => ({...e, lines: e.lines.filter(l => l.amt !== 0)})).filter(e => e.lines.length);
  }
  function closing(s){
    const list = closingEntries(s);
    list.forEach(e => post(s, 12, e.title, e.lines.map(l => [l.side, l.acct, l.amt])));
    const r = s.reg; const amt = tag => { const e = list.find(x => x.tag === tag); return e ? e.lines[0].amt : 0; };
    if (r.lease && !(r.equip && r.equip.incl)) r.lease.accrued = amt('leaseInt');
    list.filter(e => e.tag === 'dep').forEach(e => e.ref.dep += e.lines[0].amt);
    if (list.some(e => e.tag === 'leaseReturn')){ r.equip.returned = true; r.equip.dep = 0; } // 返却した資産は台帳からも外す
    if (r.aro) r.aro.liability += amt('aroInt');
    if (r.tv) r.tv.yearsLeft--;
    advance(s);
    return list;
  }

  function ledger(s, which){
    const bal = {}; C.accounts.forEach(a => bal[a.id] = s.opening[a.id] || 0);
    s.journal.forEach(e => { const x = which === 'correct' ? e.correct : e.user; if (!x || x.none) return;
      x.lines.forEach(l => bal[l.acct] += l.side === 'dr' ? l.amt : -l.amt); });
    return bal;
  }
  function statements(bal){
    const pick = (type, sign) => C.accounts.filter(a => a.type === type).map(a => ({id:a.id, name:a.name, v: sign * bal[a.id]}));
    const rev = pick('R', -1), exp = pick('X', 1);
    const sum = arr => arr.reduce((t, x) => t + x.v, 0);
    const net = sum(rev) - sum(exp);
    const assets = pick('A', 1), liab = pick('L', -1);
    const equity = pick('E', -1).map(x => x.id === 'retained' ? {...x, name:'繰越利益剰余金（当期純利益を含む）', v: x.v + net} : x);
    return {rev, exp, revTotal:sum(rev), expTotal:sum(exp), net, assets, liab, equity, aTotal:sum(assets), lTotal:sum(liab), eTotal:sum(equity)};
  }
  function standings(s, league){
    return C.teams.filter(t => t.league === league).map(t => { const r = s.standings[t.id]; return {...t, ...r, pct: (r.w + r.l) ? r.w / (r.w + r.l) : 0}; })
      .sort((a, b) => b.pct - a.pct || b.w - a.w);
  }
  function audit(s){
    const t = team(s.teamId);
    const wrong = s.journal.filter(e => e.kind === 'q' && !e.ok);
    const ub = ledger(s, 'user'), cb = ledger(s, 'correct');
    const reported = statements(ub), corrected = statements(cb);
    const rank = standings(s, t.league).findIndex(x => x.id === s.teamId) + 1;
    const S = C.score; const tg = target(s);
    const rankPts = S.rankPts[rank - 1] ?? 0;
    const profit = corrected.net;
    const profitPts = profit >= tg ? S.profitMax : profit <= 0 ? 0 : Math.round(S.profitMax * profit / tg);
    const nq = s.journal.filter(e => e.kind === 'q').length;
    const auditPts = S.auditMode === 'rate' ? (nq ? Math.round(S.auditMax * (nq - wrong.length) / nq) : S.auditMax)
      : Math.max(0, S.auditMax - S.auditPenalty * wrong.length);
    const total = rankPts + profitPts + auditPts;
    const grade = S.grades.find(g => total >= g.min);
    const diffs = C.accounts.map(a => ({...a, user:ub[a.id], correct:cb[a.id]})).filter(x => x.user !== x.correct);
    return {year:s.year, wrong, reported, corrected, rank, rankPts, profit, profitPts, auditPts, total, grade, diffs, target:tg,
      record: s.standings[s.teamId], questions: s.journal.filter(e => e.kind === 'q').length};
  }
  const summary = a => ({year:a.year, rank:a.rank, w:a.record.w, l:a.record.l, profit:a.profit, wrong:a.wrong.length, questions:a.questions, total:a.total, grade:a.grade.g});

  // 監査後の正しい残高を翌期の期首残高にする（収益・費用は繰越利益剰余金へ振り替える）
  function nextYear(s){
    const a = audit(s); s.history.push(summary(a));
    const bal = ledger(s, 'correct'); const f = statements(bal);
    const open = {};
    C.accounts.forEach(x => { if (x.type !== 'R' && x.type !== 'X' && bal[x.id]) open[x.id] = bal[x.id]; });
    open.retained = (open.retained || 0) - f.net;
    s.opening = open;
    s.fanCarry = Math.round(s.fanCarry * 0.5 + (winPct(s) - 0.5) * C.fanCarry); // 前年の勢いは半分残り、今季の勝率が上乗せされる
    C.teams.forEach(x => s.basePower[x.id] = Math.max(40, Math.min(85, Math.round((s.basePower[x.id] + (rand(s) - 0.5) * 2 * C.yearDrift) * 10) / 10)));
    s.year++;
    startYear(s, s.reg.nextSeats);
  }
  function finish(s){
    if (!s.history.some(h => h.year === s.year)) s.history.push(summary(audit(s)));
    const avg = Math.round(s.history.reduce((t, h) => t + h.total, 0) / s.history.length);
    const grade = C.score.grades.find(g => avg >= g.min).g;
    return {avg, grade, titles: s.history.filter(h => h.rank === 1).length, years: s.history.length, sold: s.history.length < s.years};
  }

  return {YEARS, ACC, team, target, fans, power, depItems, arTotal, newGame, step, question, eventDef, choose, answer, playMonth, injure, closingEntries, closing,
    ledger, statements, standings, audit, nextYear, finish, winPct};
})();

/* ==========================================================
   画面：Engine・STORY・Portrait を読んで描画するだけ
   構成：上にHUD（資金・日付・成績・メーター）→ 球場ビュー → ゲームウィンドウ → 下に帳簿メニュー
   ========================================================== */
if (typeof document !== 'undefined') (() => {

  const gradeOf = g => C.grades.find(x => x.g === g) || C.grades[C.grades.length - 1];
  // 室内練習場（1級は資産除去債務つき、2級・3級は普通の建物）。建てていなければ null
  const domeOf = () => s.reg.aro || (s.reg.fixed || []).find(f => f.key === 'build2' || f.key === 'build3') || null;

  const esc = x => String(x).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const fmt = n => (n < 0 ? '△' : '') + Math.abs(Math.round(n)).toLocaleString('ja-JP');
  const sgn = n => (n > 0 ? '+' : n < 0 ? '−' : '±') + Math.abs(Math.round(n)).toLocaleString('ja-JP');
  const acc = id => E.ACC[id].name;

  const rankOf = () => E.standings(s, teamOf().league).findIndex(x => x.id === s.teamId) + 1;
  const pickOne = (arr, k) => arr[Math.abs(k) % arr.length];
  const portrait = (spec, size) => Portrait.draw(spec, size, ST.cast, s ? teamOf().color : '#1d6a3b', s ? esc(city(teamOf())[0]) : 'D');
  const who = spec => ST.cast[spec.split(':')[0]];
  // 球団ロゴ（画像がなければ頭文字の丸いマーク）
  const hasLogo = t => typeof LOGO_IMAGES !== 'undefined' && !!LOGO_IMAGES[t.id];
  const logoOf = (t, size, tag = 'span') => hasLogo(t) ? `<img class="emblem logo" src="${LOGO_IMAGES[t.id]}" width="${size}" height="${size}" alt="${esc(t.name)}のロゴ">`
    : `<${tag} class="emblem" style="--tc:${t.color}">${esc(city(t)[0])}</${tag}>`;
  const fillT = (str, extra = {}) => {

    return str.replace(/\{(\w+)\}/g, (_, k) => ctx[k] == null ? '' : (typeof ctx[k] === 'number' ? ctx[k].toLocaleString('ja-JP') : ctx[k]));
  };
  // 仕訳は T 字の表で表示する（左＝借方、右＝貸方。画面の幅にかかわらず左右に並べる）
  const entryHTML = e => {
    if (e.none) return '<div class="tj-none">仕訳なし（帳簿には何も書かない）</div>';

    return `<table class="tj"><colgroup><col class="c-ac"><col class="c-am"><col class="c-ac"><col class="c-am"></colgroup><thead><tr><th colspan="2" class="dr">借方</th><th colspan="2" class="cr">貸方</th></tr></thead><tbody>${rows}</tbody></table>`;
  };
  // 選択肢の「よい点」と「リスク・負担」を2段に分けて表示する

    <div class="pc-row pro"><span class="pc-h">よい点</span><div class="chips">${o.pros.map(t => `<span class="chip pos">${esc(t)}</span>`).join('')}</div></div>
    <div class="pc-row con"><span class="pc-h">リスク・負担</span><div class="chips">${o.cons.map(t => `<span class="chip neg">${esc(t)}</span>`).join('')}</div></div></div>`;
  // 「費用40・入場料+15%」のような説明を、効果ごとのチップに分ける
  const chips = sub => (sub || '').split('・').map(t => {
    const cls = /−|費用|減|収入なし|下が|失|自腹|かかる/.test(t) && !/リスクなし/.test(t) ? 'neg' : /\+|増|上が|抜ける|ゼロ|リスクなし|そのまま|全部入る/.test(t) ? 'pos' : '';
    return `<span class="chip ${cls}">${esc(t)}</span>`;
  }).join('');

  /* ---------- 球場ビュー（画像版）：Gemini の4枚を背景にし、変わる部分を上から重ねる ---------- */
  function sceneSVG(){
    if (typeof STADIUM_IMAGES === 'undefined' || !STADIUM_IMAGES.day) return sceneSVGDrawn();
    const L = STADIUM_LAYOUT, t = teamOf(), st = E.step(s), m = st ? st.month : 12;
    const season = m >= 4 && m <= 9, r = s.standings[s.teamId], wp = E.winPct(s);
    const crowd = season ? Math.min(280, Math.round(E.fans(s) * (0.6 + 0.9 * wp) * 2.2)) : 0;
    const full = Math.max(0, Math.min(1, (crowd - L.crowdFrom) / (L.crowdTo - L.crowdFrom)));

    const img = (k, op) => `<image href="${STADIUM_IMAGES[k]}" x="0" y="0" width="${W}" height="${H}" preserveAspectRatio="none"${op != null ? ` opacity="${op.toFixed(2)}"` : ''}/>`;
    let g = season ? img('night_sparse') + (full > 0 ? img('night_full', full) : '') : img(m <= 3 ? 'day' : 'dusk');
    // 室内練習場（建設したら右奥の街並みに見える）

    if (s.reg.goods && s.reg.goods.year === s.year) g += `<rect x="${L.banner2[0]}" y="${L.banner2[1]}" width="170" height="30" fill="#f2c14e"/><text x="${L.banner2[0] + 85}" y="${L.banner2[1] + 21}" text-anchor="middle" font-size="16" font-weight="700" fill="#3a2a00" font-family="sans-serif">${s.year === 2 ? '創設30周年' : '記念ユニフォーム'}</text>`;
    if (champ) g += `<rect x="${W / 2 - 260}" y="${L.champY}" width="520" height="48" fill="${t.color}" stroke="#fff" stroke-width="3"/><text x="${W / 2}" y="${L.champY + 33}" text-anchor="middle" font-size="28" font-weight="700" fill="#fff" font-family="sans-serif">祝 リーグ優勝</text>`;
    const cap = season ? `${m}月・観客 ${crowd > 220 ? '満員' : crowd > 150 ? '上々' : crowd > 80 ? 'まずまず' : '空席が目立つ'}${lit ? '・LED照明' : ''}` : m <= 3 ? `第${s.year}期・オフシーズン` : `第${s.year}期・シーズン終了`;
    return `<div class="view"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t.name)}の本拠地球場"><defs><radialGradient id="ledglow"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset="1" stop-color="#dff1ff" stop-opacity="0"/></radialGradient></defs>${g}</svg><span class="cap">${cap}</span></div>`;
  }

  /* ---------- 球場ビュー（描画版：画像がないときに使う） ---------- */
  function sceneSVGDrawn(){
    const t = teamOf(); const st = E.step(s); const m = st ? st.month : 12;
    const season = m >= 4 && m <= 9; const r = s.standings[s.teamId]; const wp = E.winPct(s);
    const crowd = season ? Math.min(280, Math.round(E.fans(s) * (0.6 + 0.9 * wp) * 2.2)) : 0;

    const sky = season ? '#0b1730' : m === 12 ? '#3a3156' : m >= 10 ? '#c98a5a' : '#a9c6df';

    const champ = over && rankOf() === 1 && r.w + r.l > 0;

    if (season) for (let i = 0; i < 26; i++) g += `<circle cx="${(i * 97) % 360}" cy="${(i * 41) % 46 + 3}" r="${i % 3 ? 0.7 : 1.1}" fill="#fff" opacity=".7"/>`;
    if (m <= 3) g += `<circle cx="300" cy="22" r="10" fill="#fff4c4"/>`;

    [22, 338].forEach(x => {
      g += `<rect x="${x - 2}" y="18" width="4" height="88" fill="#69717c"/>`;
      if (lit && season) g += `<polygon points="${x - 14},20 ${x + 14},20 ${x < 180 ? 250 : 110},150 ${x < 180 ? 120 : 240},150" fill="#fff6c8" opacity=".07"/><circle cx="${x}" cy="15" r="26" fill="#fff6c8" opacity=".16"/>`;
      g += `<rect x="${x - 14}" y="8" width="28" height="14" rx="1" fill="${lit ? '#fff6c8' : season ? '#bfa85e' : '#4b5563'}"/>`;
      for (let k = 1; k < 4; k++) g += `<path d="M${x - 14 + k * 7} 8V22" stroke="rgba(0,0,0,.25)"/>`;
      g += `<path d="M${x - 14} 15H${x + 14}" stroke="rgba(0,0,0,.25)"/>`;
    });
    g += `<path d="M36 58H324L340 106H20Z" fill="#3a4250"/>`;
    for (let y = 66; y < 104; y += 8) g += `<path d="M${36 - (y - 58) / 3} ${y}H${324 + (y - 58) / 3}" stroke="rgba(255,255,255,.07)"/>`;
    const tones = [t.color, '#e8e1d5', '#c9b9a0', t.color, '#9aa7b8'];
    for (let i = 0; i < crowd; i++){
      const y = 62 + ((i * 53) % 42); const spread = (y - 58) / 3;
      const x = 40 - spread + ((i * 137) % Math.round(280 + spread * 2));
      g += `<circle cx="${x}" cy="${y}" r="1.6" fill="${tones[i % tones.length]}"/>`;
    }
    if (champ) g += `<rect x="96" y="70" width="168" height="20" fill="${t.color}"/><text x="180" y="85" text-anchor="middle" font-size="13" font-weight="700" fill="#fff" font-family="sans-serif">祝 リーグ優勝</text>`;
    if (s.year === 2 && s.reg.goods) g += `<rect x="60" y="62" width="44" height="12" fill="#f2c14e"/><text x="82" y="71" text-anchor="middle" font-size="7" font-weight="700" fill="#3a2a00" font-family="sans-serif">創設30周年</text>`;
    g += `<rect x="138" y="12" width="84" height="42" rx="2" fill="#0f1418" stroke="${t.color}" stroke-width="2"/>
      <text x="180" y="25" text-anchor="middle" font-size="9" fill="#e8eef5" font-family="sans-serif">${esc(city(t))}・第${s.year}期</text>
      <text x="180" y="42" text-anchor="middle" font-size="15" fill="#f2c14e" font-family="monospace">${season || r.w + r.l ? r.w + '-' + r.l : 'OFF'}</text>
      <text x="180" y="51" text-anchor="middle" font-size="7" fill="#8fa7b5" font-family="sans-serif">${season ? m + '月' : m <= 3 ? 'OFF SEASON' : 'FINAL'}</text>`;
    if (s.reg.tv && s.reg.tv.yearsLeft > 0 && season) g += `<rect x="228" y="14" width="26" height="11" rx="2" fill="#c8102e"/><text x="241" y="22.5" text-anchor="middle" font-size="7" font-weight="700" fill="#fff" font-family="sans-serif">LIVE</text>`;
    g += `<rect x="0" y="104" width="360" height="8" fill="${t.color}"/>`;
    ['青空信金', 'みなと保険', '帳簿堂'].forEach((ad, i) => g += `<text x="${70 + i * 110}" y="110.5" text-anchor="middle" font-size="6" fill="#fff" opacity=".85" font-family="sans-serif">${ad}</text>`);
    g += `<rect x="0" y="112" width="360" height="68" fill="${m <= 3 ? '#6f8f6a' : '#2f7d46'}"/>`;
    for (let i = 0; i < 9; i++) g += `<rect x="${i * 40}" y="112" width="20" height="68" fill="#fff" opacity=".035"/>`;
    g += `<path d="M180 172L0 116M180 172L360 116" stroke="#fff" stroke-width="1" opacity=".7"/>
      <polygon points="180,122 238,147 180,172 122,147" fill="#b98b5a"/><polygon points="180,131 218,147 180,163 142,147" fill="#3b8c52"/><circle cx="180" cy="147" r="4" fill="#b98b5a"/>`;
    [[180, 122], [238, 147], [122, 147], [180, 171]].forEach(([x, y]) => g += `<rect x="${x - 2}" y="${y - 2}" width="4" height="4" transform="rotate(45 ${x} ${y})" fill="#fff"/>`);

    return `<div class="view"><svg viewBox="0 0 360 180" role="img" aria-label="${esc(t.name)}の本拠地球場">${g}</svg><span class="cap">${cap}</span></div>`;
  }


  /* ---------- HUD ---------- */
  function hudHTML(){
    const t = teamOf(); const st = E.step(s); const r = s.standings[s.teamId];
    const cash = E.ledger(s, 'user').cash; const fans = E.fans(s); const pw = E.power(s); const fat = s.fatigue || 0;
    const m = st ? st.month : 12;
    const pips = Array.from({length:12}, (_, i) => {
      const mm = i + 1, ln = s.line[mm];
      const cls = mm === m ? 'now' : ln ? (ln.w >= ln.l ? 'pw' : 'pl') : mm < m ? 'past' : '';
      return `<i class="${cls}" title="${mm}月${ln ? ` ${ln.w}勝${ln.l}敗` : ''}"></i>`;
    }).join('');
    return `<header class="hud" style="--tc:${t.color}">
      <div class="hud-row">
        ${logoOf(t, 42, 'div')}
        <div class="hud-team"><b>${esc(t.name)}<em class="gbadge">${esc(gradeOf(s.grade || 1).label)}</em></b><span>第${s.year}期／全${s.years}期・${m}月　${r.w}勝${r.l}敗${r.w + r.l ? `・${rankOf()}位` : ''}</span></div>
        <div class="hud-money"><span>資金</span><b class="num">${fmt(cash)}</b>${moneyFx != null ? `<em class="fx ${moneyFx >= 0 ? 'up' : 'down'}">${sgn(moneyFx)}</em>` : ''}</div>

        <div class="meters">
          <span class="mt">戦力<b>${Math.round(pw)}</b><i><u style="width:${Math.max(0, Math.min(100, pw))}%"></u></i></span>
          <span class="mt">人気<b>${fans}</b><i><u style="width:${Math.max(0, Math.min(100, fans))}%"></u></i></span>
          <span class="mt fat">疲労<b>${fat}</b><i><u style="width:${Math.min(100, fat * 12.5)}%"></u></i></span>
        </div>
      </div></header>`;
  }

  function viewHTML(){
    const st = E.step(s); const m = st ? st.month : 12;

  /* ---------- 会話 ---------- */
  const keyFor = st => st.type === 'event' ? 'event:' + st.id : st.type === 'question' ? 'q:' + st.id : st.type === 'play' ? 'play:' + st.month
    : st.type === 'policy' ? 'policy:' + st.month : st.type === 'incident' ? 'inc:' + s.incidents[st.month] : st.type === 'special' ? 'special' : st.type;
  function maybeDialog(){
    const st = E.step(s); if (!st) return;
    const key = keyFor(st); const yk = `y${s.year}:${key}`; const mk = `y${s.year}:m${st.month}:${key}`;
    if (s.seen[mk]) return; s.seen[mk] = true;
    const start = s.year === 1 ? ST.yearStart[1] : s.year === s.years ? ST.yearStart.final : s.year === 2 ? ST.yearStart[2] : ST.yearStart.mid[(s.year - 3) % ST.yearStart.mid.length];
    const tm = (ST.teams || {})[s.teamId] || {};
    const first = !s.seen['open:' + s.year]; s.seen['open:' + s.year] = true; // その期で最初の場面（期首の話を入れる）
    let opening = first ? (start || []).slice() : [];
    if (first && s.year === 1 && tm.intro){ // オーナーの話のあとに、球団ごとの事情を差し込む
      let at = 0; opening.forEach((l, i) => { if (l[0].startsWith('owner')) at = i + 1; });
      opening.splice(at, 0, ...tm.intro);
    }
    let lines = opening.concat(st.type === 'special' ? (tm.before || []) : (ST.scenes[yk] || ST.scenes[key] || []));
    if (st.type === 'policy' && !ST.scenes[yk]) lines = [s.fatigue >= 3 ? ST.policyTalk.fatigue : ST.policyTalk.fresh];
    if (lines.length) dlg = {lines, i:0};
  }
  function dialogBox([spec, text], live){
    const c = who(spec); const tag = live ? 'button' : 'div';
    const more = live ? `<span class="next">${dlg.i < dlg.lines.length - 1 ? '次へ ▼' : '閉じる ▼'}</span>` : '';
    return `<${tag} class="dialog" ${live ? 'data-act="talk"' : ''} style="--nc:${c.bg}">
      <div class="dface">${portrait(spec, 96)}</div>
      <div class="dtext"><span class="name">${esc(c.name)}<small>${esc(c.role)}</small></span><p>${esc(fillT(text))}</p>${more}</div></${tag}>`;
  }
  const advisorsHTML = id => { id = ST.advisors[id + '@' + (s.grade || 1)] ? id + '@' + (s.grade || 1) : id; // 級ごとの台詞があればそちらを使う
    return (ST.advisors[id] || []).length ? `<div class="advisors">${ST.advisors[id].map(([w, tx]) => `<div class="adv">${portrait(w, 48)}<div><b>${esc(who(w).name)}</b>${esc(fillT(tx))}</div></div>`).join('')}</div>` : ''; };
  const toastHTML = () => toast ? `<div class="react">${portrait('senpai:smile', 40)}<span>${esc(toast)}</span></div>` : '';
  const ribbon = (kind, text) => `<div class="ribbon ${kind}"><span>${esc(text)}</span></div>`;

  /* ---------- タイトル ---------- */
  // タイトルからの流れ：スタート画面（タップ）→ 級の選択 → 期数の選択（級ごとのおすすめつき）→ 球団の選択
  let titleStep = 'start';
  function titleScreen(){
    const bgUrl = (typeof STADIUM_IMAGES !== 'undefined' && STADIUM_IMAGES.night_full) ? STADIUM_IMAGES.night_full : '';
    const bg = bgUrl ? `style="background-image:linear-gradient(180deg,rgba(6,10,20,.55),rgba(6,10,20,0) 32%,rgba(6,10,20,0) 52%,rgba(6,10,20,.8) 100%),url(${bgUrl})"` : '';
    const steps = ['級', '期数', '球団'];

    const back = `<button class="backbtn" data-title="${titleStep === 'team' ? 'years' : titleStep === 'years' ? 'grade' : 'start'}">‹ もどる</button>`;
    const G = gradeOf(grade);

      app.innerHTML = `
        <button class="start" ${bg} data-title="grade" aria-label="タップしてはじめる">

          <span class="cast">${Object.keys(ST.cast).map(id => `<span class="cm">${portrait(id, 44)}<small>${esc(ST.cast[id].name.split(' ')[0])}</small></span>`).join('')}</span>
          <span class="tap">TAP TO START</span>
        </button>`;
    } else if (titleStep === 'grade'){
      app.innerHTML = `
        <section class="setup">${back}${progress(0)}
          <h2>どの級の範囲で遊びますか？</h2>
          <p class="dim">日商簿記の出題区分表（2027年度適用）に合わせて、出てくる取引が変わる。上の級ほど、下の級の論点も少しずつ出る。</p>
          <div class="yearlist">${C.grades.map(x => `<button class="yearcard" data-grade="${x.g}"><b>${esc(x.label)}</b><span>${esc(x.sub)}</span><i>›</i></button>`).join('')}</div>
        </section>`;
    } else if (titleStep === 'years'){
      app.innerHTML = `
        <section class="setup">${back}${progress(1)}
          <h2>何期つとめますか？</h2>
          <p class="dim">${esc(G.label)}。会計期間は毎期1月1日〜12月31日。1期ごとに決算と監査がある。</p>
          <div class="yearlist">${C.yearChoices.map(y => `<button class="yearcard${y.n === G.years ? ' rec' : ''}" data-years="${y.n}"><b>${y.label}${y.n === G.years ? `<em class="recmark">${esc(G.label)}のおすすめ</em>` : ''}</b><span>${esc(y.sub)}</span><i>›</i></button>`).join('')}</div>
        </section>`;
    } else {
      app.innerHTML = `
        <section class="setup">${back}${progress(2)}
          <h2>担当する球団を選んでください</h2>

          ${C.teams.filter(t => t.league === lg.id).map(t => `
            <button class="team" style="--tc:${t.color}" data-team="${t.id}">
              ${logoOf(t, 52)}
              <span class="tinfo"><b>${esc(t.name)}</b>${ST.teams && ST.teams[t.id] ? `<span class="premise">${esc(ST.teams[t.id].premise)}</span>` : ''}
                <span class="bar"><em>戦力</em><i><u style="width:${(t.power - 40) * 2.2}%"></u></i></span>
                <span class="bar"><em>人気</em><i><u style="width:${(t.fans - 40) * 1.8}%"></u></i></span>

  /* ---------- ゲームウィンドウの中身 ---------- */
  function stageHTML(){
    const st = E.step(s); const t = teamOf();
    if (s.pendingQ || st.type === 'question'){
      const q = E.question(s);
      const head = `${ribbon('q', `${st.month}月・仕訳`)}<h2>${esc(q.title)}</h2>

      if (pick != null){
        const o = q.options[pick];
        return `<section class="win">${head}
